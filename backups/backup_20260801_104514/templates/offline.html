<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión · La Tribu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 2rem;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,140,0,0.2);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(255,140,0,0.12);
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        .brand {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #ff8c00;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,140,0,0.1);
            color: #ff8c00;
            border: 1px solid rgba(255,140,0,0.3);
            border-radius: 50px;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0.25rem;
        }
        .hint {
            font-size: 0.82rem;
            color: #999;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .btn-retry {
            display: block;
            width: 100%;
            padding: 0.85rem;
            border-radius: 50px;
            background: #ff8c00;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: background 0.2s;
        }
        .btn-retry:hover { background: #e07800; }
        .wave {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            opacity: 0.07;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏔️</div>
        <div class="brand">La Tribu de Los Libres</div>
        <h1>Sin conexión</h1>
        <p>
            Parece que no tienes internet en este momento.<br>
            Las páginas que visitaste antes siguen disponibles.
        </p>

        <div>
            <span class="pill">📱 Inicio</span>
            <span class="pill">⛺ Rifas</span>
            <span class="pill">🗺️ Caminatas</span>
        </div>

        <button class="btn-retry" onclick="intentarReconectar()">
            🔄 Intentar reconectar
        </button>

        <p class="hint">
            La app guarda automáticamente las páginas que visitas.<br>
            Cuando recuperes la señal, todo se actualizará solo.
        </p>
    </div>

    <svg class="wave" viewBox="0 0 1440 120" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ff8c00" d="M0,64L48,69.3C96,75,192,85,288,80C384,75,480,53,576,48C672,43,768,53,864,64C960,75,1056,85,1152,80C1248,75,1344,53,1392,42.7L1440,32L1440,120L1392,120C1344,120,1248,120,1152,120C1056,120,960,120,864,120C768,120,672,120,576,120C480,120,384,120,288,120C192,120,96,120,48,120L0,120Z"/>
    </svg>

    <script>
        function intentarReconectar() {
            window.location.reload();
        }
        // Auto-reintento silencioso cada 8s
        setInterval(() => {
            fetch('/manifest.json', { cache: 'no-store' })
                .then(() => window.location.href = '/')
                .catch(() => {});
        }, 8000);
    </script>
</body>
</html>
