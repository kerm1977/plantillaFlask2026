{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="glass-panel rounded-5 p-4">
        <a href="/rifas" class="btn btn-outline-secondary rounded-pill mb-3">
            <i class="bi bi-arrow-left me-1"></i>Volver a Rifas
        </a>
        
        <h2 class="fw-bold text-orange mb-4"><i class="bi bi-ticket me-2"></i>Mis Selecciones</h2>
        
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">Teléfono</label>
                <input type="text" id="phone" class="form-control" placeholder="Tu teléfono">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label fw-bold">PIN</label>
                <input type="text" id="pin" class="form-control" placeholder="Tu PIN (4 caracteres)" maxlength="4" pattern="[A-Za-z0-9]{4}">
            </div>
        </div>
        
        <button onclick="buscarSelecciones()" class="btn btn-orange rounded-pill px-4 mt-3">
            <i class="bi bi-search me-1"></i>Buscar Mis Selecciones
        </button>
        
        <div id="resultsContainer" class="mt-4"></div>
    </div>
</div>

<script>
function buscarSelecciones() {
    const phone = document.getElementById('phone').value.trim();
    const pin = document.getElementById('pin').value.trim();
    
    if (!phone || !pin) {
        alert('Ingresa teléfono y PIN');
        return;
    }
    
    if (pin.length !== 4 || !/^[A-Za-z0-9]{4}$/.test(pin)) {
        alert('El PIN debe tener 4 caracteres alfanuméricos');
        return;
    }
    
    fetch('/rifas/mis-selecciones/ver', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone, pin: pin })
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            mostrarResultados(data.selections);
        } else {
            alert(data.error || 'Error al buscar');
        }
    });
}

function mostrarResultados(selections) {
    const container = document.getElementById('resultsContainer');
    
    if (selections.length === 0) {
        container.innerHTML = '<p class="text-muted">No hay selecciones encontradas.</p>';
        return;
    }
    
    let html = '';
    selections.forEach(group => {
        const numbersHtml = group.selections.map(s => 
            `<span class="badge bg-primary rounded-pill me-1 mb-1" style="font-size: 1rem;">${s.number}</span>`
        ).join('');
        
        html += `
        <div class="rounded-4 p-4 mb-3" style="background: rgba(255,255,255,0.7); border-left: 4px solid #ff8c00;">
            <h5 class="fw-bold">${group.raffle_name}</h5>
            <p class="mb-1"><strong>Nombre:</strong> ${group.customer_name}</p>
            <p class="mb-1"><strong>Precio por número:</strong> ₡${group.price}</p>
            <div class="mb-2">
                <strong>Números seleccionados:</strong><br>
                ${numbersHtml}
            </div>
            <p class="fw-bold text-orange fs-5">Total a pagar: ₡${group.total}</p>
            <div class="d-flex gap-2 flex-wrap">
                <a href="/rifas/${group.raffle_id}" class="btn btn-orange rounded-pill">
                    <i class="bi bi-plus-circle me-1"></i>Agregar más números
                </a>
                <button onclick="liberarNumeros('${group.raffle_id}', '${group.customer_name}')" class="btn btn-danger rounded-pill">
                    <i class="bi bi-x-circle me-1"></i>Liberar números
                </button>
            </div>
        </div>`;
    });
    
    container.innerHTML = html;
}

function liberarNumeros(raffleId, customerName) {
    const phone = document.getElementById('phone').value.trim();
    const pin = document.getElementById('pin').value.trim();
    
    abrirModalBorrarUnificado({
        titulo: 'Liberar Números',
        mensaje: '¿Liberar todos los números de este participante?',
        nombre: customerName,
        onConfirmar: () => {
            // Mostrar lista de selecciones para liberar individualmente
            // Por ahora, implementamos liberación individual en la vista de detalle
            window.location.href = `/rifas/${raffleId}`;
        }
    });
}
</script>
{% endblock %}
