{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="glass-panel rounded-5 p-4">
        <a href="{{ url_for('main.admin_rifas') }}" class="btn btn-outline-secondary rounded-pill mb-3">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
        
        <h2 class="fw-bold text-orange mb-4"><i class="bi bi-pencil me-2"></i>Editar Rifa</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Número de Rifa</label>
                    <input type="text" name="raffle_number" class="form-control" required value="{{ rifa.raffle_number }}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Nombre de la Rifa</label>
                    <input type="text" name="name" class="form-control" required value="{{ rifa.name }}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Precio (₡)</label>
                    <input type="number" name="price" class="form-control" required value="{{ rifa.price }}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Premio</label>
                    <input type="text" name="prize" class="form-control" required value="{{ rifa.prize }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea name="detail" class="form-control" rows="3" required>{{ rifa.detail }}</textarea>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Fecha del Sorteo</label>
                    <input type="date" name="raffle_date" class="form-control" required value="{{ rifa.raffle_date.strftime('%Y-%m-%d') }}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Hora del Sorteo</label>
                    <input type="time" name="raffle_time" class="form-control" value="{{ rifa.raffle_time or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Imagen actual</label>
                    <img src="{{ url_for('static', filename='uploads/rifas/' + rifa.image_filename) }}" class="rounded-3" style="max-height: 200px;">
                    <label class="form-label fw-bold mt-2">Cambiar imagen (opcional)</label>
                    <input type="file" name="image" class="form-control" accept=".png,.jpg,.jpeg">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Nombre SINPE</label>
                    <input type="text" name="sinpe_name_default" class="form-control" value="{{ rifa.sinpe_name_default or '' }}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Teléfono SINPE</label>
                    <input type="text" name="sinpe_phone_default" class="form-control" value="{{ rifa.sinpe_phone_default or '' }}">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if rifa.is_active %}checked{% endif %}>
                        <label class="form-check-label fw-bold" for="isActive">Rifa Activa</label>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-orange rounded-pill px-4 py-2 fw-bold">
                    <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
