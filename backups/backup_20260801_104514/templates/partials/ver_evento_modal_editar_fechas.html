
                    <!-- Nacional -->
                    <div id="editNationalFields" class="p-3 p-md-4 rounded-4 mb-4" style="background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255, 255, 255, 0.4);">
                        
                        <!-- SWITCH: DÍA SEGURO -->
                        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3 gap-2 border-bottom border-white border-opacity-50 pb-2">
                            <h5 class="fw-bold mb-0 text-orange">Fechas de Actividad</h5>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input m-0" type="checkbox" id="editDiaSeguroToggle" onchange="toggleEditDiaSeguro()" style="width: 2.5rem; height: 1.3rem; cursor: pointer;" {% if evento.solo_chat %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-danger small ms-2 mb-0" for="editDiaSeguroToggle" style="cursor: pointer; padding-top: 1px;">
                                    <i class="bi bi-shield-lock-fill me-1"></i>Ocultar Día Exacto
                                </label>
                            </div>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-md-4">
                                <label class="form-label fw-bold text-muted small mb-1">Cantidad de Días</label>
                                <input type="number" id="editDias" name="dias" min="1" max="10" value="{{ evento.dias }}" onchange="toggleEditDateInputs()" class="form-control glass-input rounded-3">
                            </div>
                            
                            <!-- FECHA ÚNICA (DIVIDIDA) -->
                            <div id="editSingleDateGroup" class="col-12 col-md-8">
                                <label class="form-label fw-bold text-muted small mb-1">Fecha de Actividad</label>
                                <div class="row g-1 date-split">
                                    <div class="col-3 edit-normal-day">
                                        <input type="number" id="e_dayUnica" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                    </div>
                                    <div class="col-3 edit-secure-day d-none">
                                        <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.8rem;">
                                    </div>
                                    <div class="col-5">
                                        <select id="e_monthUnica" class="form-select glass-input rounded-3">
                                            <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
                                            <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
                                            <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
                                            <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
                                        </select>
                                    </div>
                                    <div class="col-4">
                                        <input type="number" id="e_yearUnica" class="form-control glass-input rounded-3" value="2026" min="2024">
                                    </div>
                                </div>
                            </div>

                            <!-- RANGO DE FECHAS -->
                            <div id="editRangeDateGroup" class="col-12 col-md-8 d-none">
                                <div class="row g-2">
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label fw-bold text-muted small mb-1">Fecha Inicio</label>
                                        <div class="row g-1 date-split">
                                            <div class="col-3 edit-normal-day">
                                                <input type="number" id="e_dayInicio" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                            </div>
                                            <div class="col-3 edit-secure-day d-none">
                                                <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.8rem;">
                                            </div>
                                            <div class="col-5">
                                                <select id="e_monthInicio" class="form-select glass-input rounded-3">
                                                    <option value="01">Ene</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Abr</option>
                                                    <option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option>
                                                    <option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
                                                </select>
                                            </div>
                                            <div class="col-4">
                                                <input type="number" id="e_yearInicio" class="form-control glass-input rounded-3" value="2026" min="2024">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12 col-sm-6">
                                        <label class="form-label fw-bold text-muted small mb-1">Fecha Regreso</label>
                                        <div class="row g-1 date-split">
                                            <div class="col-3 edit-normal-day">
                                                <input type="number" id="e_dayRegreso" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                            </div>
                                            <div class="col-3 edit-secure-day d-none">
                                                <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.8rem;">
                                            </div>
                                            <div class="col-5">
                                                <select id="e_monthRegreso" class="form-select glass-input rounded-3">
                                                    <option value="01">Ene</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Abr</option>
                                                    <option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option>
                                                    <option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
                                                </select>
                                            </div>
                                            <div class="col-4">
                                                <input type="number" id="e_yearRegreso" class="form-control glass-input rounded-3" value="2026" min="2024">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SWITCH: LOGÍSTICA SEGURA -->
                        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3 mt-4 gap-2 border-bottom border-white border-opacity-50 pb-2">
                            <h5 class="fw-bold mb-0 text-orange">Logística de Salida</h5>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input m-0" type="checkbox" id="editLogisticaSeguraToggle" onchange="toggleEditLogisticaSegura()" style="width: 2.5rem; height: 1.3rem; cursor: pointer;" {% if is_logistica_segura or evento.logistica_segura %}checked{% endif %}>
                                <label class="form-check-label fw-bold text-danger small ms-2 mb-0" for="editLogisticaSeguraToggle" style="cursor: pointer; padding-top: 1px;">
                                    <i class="bi bi-shield-lock-fill me-1"></i>Ocultar Logística
                                </label>
                            </div>
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small mb-1">Hora de Salida</label>
                                <div class="edit-normal-logistics">
                                    <input type="time" id="editHoraSalida" name="horaSalida" class="form-control glass-input rounded-3" value="{{ evento.hora_salida or '' }}">
                                </div>
                                <input type="text" class="form-control glass-input rounded-3 edit-secure-logistics d-none fw-bold text-danger bg-light" value="⏰ Privado en chat" disabled>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-bold text-muted small mb-1">Lugar de Salida</label>
                                <div class="edit-normal-logistics">
                                    <select id="editLugarSalida" name="lugarSalida" class="form-select glass-input rounded-3">
                                        <option value="Parque de Tres Ríos - Escuela" {% if lugar_real == 'Parque de Tres Ríos - Escuela' %}selected{% endif %}>Parque de Tres Ríos - Escuela</option>
                                        <option value="Parque de Tres Ríos - Cruz Roja" {% if lugar_real == 'Parque de Tres Ríos - Cruz Roja' %}selected{% endif %}>Parque de Tres Ríos - Cruz Roja</option>
                                        <option value="Parque de Tres Ríos - Letras" {% if lugar_real == 'Parque de Tres Ríos - Letras' %}selected{% endif %}>Parque de Tres Ríos - Letras</option>
                                        <option value="San José" {% if lugar_real == 'San José' %}selected{% endif %}>San José (Sabana)</option>
                                        <option value="{{ lugar_real }}" {% if lugar_real not in ['Parque de Tres Ríos - Escuela', 'Parque de Tres Ríos - Cruz Roja', 'Parque de Tres Ríos - Letras', 'San José'] %}selected{% endif %}>{{ lugar_real }}</option>
                                    </select>
                                </div>
                                <input type="text" class="form-control glass-input rounded-3 edit-secure-logistics d-none fw-bold text-danger bg-light" value="📍 Privado en chat" disabled>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label fw-bold text-muted small mb-1">Pasamos a recoger en (Separar por comas):</label>
                            <div class="edit-normal-logistics">
                                <textarea id="editPuntosRecogida" name="puntosRecogida" rows="2" class="form-control glass-input rounded-3">{{ evento.puntos_recogida or '' }}</textarea>
                            </div>
                            <input type="text" class="form-control glass-input rounded-3 edit-secure-logistics d-none fw-bold text-danger bg-light" value="🚍 Logística interna" disabled>
                        </div>
                    </div>
