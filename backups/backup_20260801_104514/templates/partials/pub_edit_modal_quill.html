<!-- Quill WYSIWYG -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<style>
  #pubDescEditor { background:#fff; font-size:14px; }
  #pubDescEditor .ql-editor {
    min-height:140px;
    font-weight: 400 !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #pubDescEditor .ql-editor strong,
  #pubDescEditor .ql-editor b { font-weight: 700 !important; }
  #pubDescEditor .ql-editor em,
  #pubDescEditor .ql-editor i { font-style: italic !important; }
  #pubDescEditor .ql-editor u { text-decoration: underline !important; }
  #pubDescEditor .ql-editor s { text-decoration: line-through !important; }
  .ql-toolbar.ql-snow { border-radius:0.375rem 0.375rem 0 0; border-color:#ced4da; background:#f8f9fa; }
  .ql-container.ql-snow { border-radius:0 0 0.375rem 0.375rem; border-color:#ced4da; }
</style>
<script>
  (function() {
    const toolbarOptions = [
      ['bold', 'italic', 'underline', 'strike'],
      [{ 'size': ['small', false, 'large', 'huge'] }],
      [{ 'align': [] }],
      [{ 'list': 'ordered' }, { 'list': 'bullet' }],
      ['clean']
    ];
    window._quillDesc = new Quill('#pubDescEditor', {
      theme: 'snow',
      modules: { toolbar: toolbarOptions },
      placeholder: 'Describe el evento...'
    });
  })();
</script>
