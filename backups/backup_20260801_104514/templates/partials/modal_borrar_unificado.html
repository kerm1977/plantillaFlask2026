<!-- MODAL DE BORRAR UNIFICADO -->
<div class="modal fade" id="modalBorrarUnificado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h4 class="modal-title fw-bold text-dark w-100 text-center" id="modalBorrarUnificadoTitulo"><i class="bi bi-trash text-danger me-2"></i>Borrar</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body px-4 pb-5 pt-2 text-start">
                <p class="text-secondary mb-3 text-center" id="modalBorrarUnificadoMensaje">¿Estás seguro?</p>
                <p class="fw-bold text-dark mb-4 text-center" id="modalBorrarUnificadoNombre"></p>
                <div class="d-flex flex-column gap-2">
                    <button class="btn btn-danger w-100 rounded-pill fw-bold py-3 shadow" id="btnConfirmarBorrarUnificado" onclick="ejecutarBorrarUnificado()">
                        <i class="bi bi-trash me-1"></i>Sí, borrar
                    </button>
                    <button class="btn btn-outline-secondary w-100 rounded-pill fw-bold py-3" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let _borrarUnificadoCallback = null;
const modalBorrarUnificadoEl = document.getElementById('modalBorrarUnificado');
if (modalBorrarUnificadoEl) {
    modalBorrarUnificadoEl.addEventListener('hidden.bs.modal', () => { _borrarUnificadoCallback = null; });
}

function abrirModalBorrarUnificado({ titulo = 'Borrar', mensaje = '¿Estás seguro?', nombre = '', onConfirmar }) {
    const modalEl = document.getElementById('modalBorrarUnificado');
    if (!modalEl) return;
    const tituloEl = document.getElementById('modalBorrarUnificadoTitulo');
    const mensajeEl = document.getElementById('modalBorrarUnificadoMensaje');
    const nombreEl = document.getElementById('modalBorrarUnificadoNombre');
    if (tituloEl) tituloEl.innerHTML = '<i class="bi bi-trash text-danger me-2"></i>' + titulo;
    if (mensajeEl) mensajeEl.textContent = mensaje;
    if (nombreEl) nombreEl.textContent = nombre;
    _borrarUnificadoCallback = onConfirmar;
    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    modal.show();
}

function ejecutarBorrarUnificado() {
    if (typeof _borrarUnificadoCallback === 'function') _borrarUnificadoCallback();
    const modalEl = document.getElementById('modalBorrarUnificado');
    if (modalEl) bootstrap.Modal.getOrCreateInstance(modalEl).hide();
}
</script>
