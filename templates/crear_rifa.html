{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="glass-panel rounded-5 p-4">
        <a href="{{ url_for('main.admin_rifas') }}" class="btn btn-outline-secondary rounded-pill mb-3">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
        
        <h2 class="fw-bold text-orange mb-4"><i class="bi bi-plus-circle me-2"></i>Crear Nueva Rifa</h2>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Número de Rifa</label>
                    <input type="text" name="raffle_number" class="form-control" required placeholder="Ej: RIFA-001">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Nombre de la Rifa</label>
                    <input type="text" name="name" class="form-control" required placeholder="Ej: Rifa Navideña">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Precio (₡)</label>
                    <input type="number" name="price" class="form-control" required placeholder="Ej: 1000">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Premio</label>
                    <input type="text" name="prize" class="form-control" required placeholder="Ej: iPhone 15">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Descripción</label>
                    <textarea name="detail" class="form-control" rows="3" required placeholder="Detalles de la rifa..."></textarea>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Fecha del Sorteo</label>
                    <input type="date" name="raffle_date" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Hora del Sorteo</label>
                    <input type="time" name="raffle_time" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">Imagen</label>
                    <input type="file" name="image" class="form-control" accept=".png,.jpg,.jpeg" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Nombre SINPE (opcional)</label>
                    <input type="text" name="sinpe_name_default" class="form-control" placeholder="Nombre para pagos SINPE">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label fw-bold">Teléfono SINPE (opcional)</label>
                    <input type="text" name="sinpe_phone_default" class="form-control" placeholder="Teléfono para pagos SINPE">
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-orange rounded-pill px-4 py-2 fw-bold">
                    <i class="bi bi-check-lg me-1"></i>Crear Rifa
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
