     Explicar antes de editar. Contenido sagrado protegido.
============================================================== -->
<style>
  .reglamento-contenido { font-size: .875rem; }
  .reglamento-contenido h5 { font-weight: 700; text-align: center; margin-bottom: 0; }
  .reglamento-contenido h5 + p { color: #6c757d; margin-bottom: 1rem; }
  .reglamento-contenido h6 { font-weight: 700; color: var(--primary-orange, #ff8c00); margin-top: 1rem; }
  .reglamento-contenido b, .reglamento-contenido strong { font-weight: 700; }
  .reglamento-contenido.editando { outline: 2px dashed #ff8c00; border-radius: .75rem; padding: .75rem; background: #fffaf2; min-height: 200px; }
</style>
<div class="accordion mb-4" id="reglamentoPuntosAcc">
  <div class="accordion-item border-0 rounded-4 overflow-hidden shadow-sm">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed fw-bold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#reglamentoPuntos" aria-expanded="false" aria-controls="reglamentoPuntos">
        <i class="bi bi-journal-text text-orange me-2"></i>Reglamento acerca de los puntos
      </button>
    </h2>
    <div id="reglamentoPuntos" class="accordion-collapse collapse" data-bs-parent="#reglamentoPuntosAcc">
      <div class="accordion-body text-dark">
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-3" id="rgCompartir">
          <a href="{{ url_for('main.reglamento_whatsapp') }}" target="_blank" rel="noopener" class="btn btn-success btn-sm rounded-pill fw-bold"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a>
          <a href="{{ url_for('main.reglamento_txt') }}" class="btn btn-secondary btn-sm rounded-pill fw-bold"><i class="bi bi-file-earmark-text me-1"></i>TXT</a>
          <a href="{{ url_for('main.reglamento_pdf') }}" class="btn btn-danger btn-sm rounded-pill fw-bold"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>
          {% if is_super %}<button type="button" id="rgEditar" class="btn btn-outline-dark btn-sm rounded-pill fw-bold"><i class="bi bi-pencil-square me-1"></i>Editar reglamento</button>{% endif %}
        </div>
        {% if is_super %}
        <div id="rgBarra" class="d-none mb-2">
          <div class="d-flex flex-wrap gap-1 mb-2 p-2 rounded-3 bg-light border">
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="titulo" title="Título (formato de capítulo)"><i class="bi bi-type-h1 me-1"></i>Título</button>
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="bold" title="Negrita"><i class="bi bi-type-bold"></i></button>
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="justifyLeft" title="Alinear a la izquierda"><i class="bi bi-text-left"></i></button>
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="justifyRight" title="Alinear a la derecha"><i class="bi bi-text-right"></i></button>
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="insertOrderedList" title="Lista ordenada"><i class="bi bi-list-ol"></i></button>
            <button type="button" class="btn btn-sm btn-outline-dark rg-cmd" data-cmd="insertUnorderedList" title="Viñetas"><i class="bi bi-list-ul"></i></button>
            <span class="border-start mx-1"></span>
            <button type="button" class="btn btn-sm btn-outline-orange rg-cmd" data-cmd="capitulo"><i class="bi bi-plus-lg me-1"></i>Capítulo</button>
            <button type="button" class="btn btn-sm btn-outline-orange rg-cmd" data-cmd="articulo"><i class="bi bi-plus-lg me-1"></i>Artículo</button>
          </div>
          <div class="d-flex gap-2 justify-content-end align-items-center">
            <span id="rgMsg" class="small text-success me-auto"></span>
            <button type="button" id="rgCancelar" class="btn btn-secondary btn-sm rounded-pill px-3">Cancelar</button>
            <button type="button" id="rgGuardar" class="btn btn-success btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-save me-1"></i>Guardar cambios</button>
          </div>
        </div>
        {% endif %}
        <div id="reglamentoContenido" class="reglamento-contenido" data-guardar="{{ url_for('main.reglamento_guardar') if is_super else '' }}">{{ reglamento_html() | safe }}</div>
      </div>
    </div>
  </div>
</div>
{% if is_super %}<script src="{{ url_for('static', filename='js/reglamento_editor.js') }}"></script>{% endif %}
