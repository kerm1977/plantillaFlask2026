<script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. CÁLCULO DE EDAD AUTOMÁTICO
    const dobElement = document.getElementById('dob-display');
    if (dobElement) {
        const dobStr = dobElement.getAttribute('data-dob');
        if (dobStr && dobStr.trim() !== '') {
            const dob = new Date(dobStr);
            const today = new Date();
            let age = today.getFullYear() - dob.getFullYear();
            const m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                age--;
            }
            
            const badge = document.getElementById('age-badge');
            badge.innerHTML = `<i class="bi bi-balloon-fill text-warning me-1"></i> ${age} años`;
            badge.style.display = 'inline-block';
        }
    }

    // 2. PRE-CARGAR INFORMACIÓN ADICIONAL (TELÉFONO) EN MODAL DE EDICIÓN
    const existingPhone = "{{ user.phone or '' }}";
    if (existingPhone && existingPhone.trim() !== '' && existingPhone !== 'No registrado') {
        const editDynSelect = document.getElementById('editDynamicSelect');
        const editDynContainer = document.getElementById('editDynamicContainer');
        if (editDynSelect && editDynContainer) {
            editDynSelect.value = 'Telefono';
            editDynContainer.innerHTML = `
                <div class="input-group">
                    <span class="input-group-text glass-input border-end-0 text-orange"><i class="bi bi-phone"></i></span>
                    <input type="text" name="phone" class="form-control glass-input py-2" placeholder="Digite el número telefónico" 
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="15" value="${existingPhone}">
                </div>
                <small class="text-muted mt-1 d-block ps-2">Solo números permitidos.</small>`;
        }
    }

    // Lógica del Editor de Imagen en Modal de Edición
    const editAvatarUpload = document.getElementById('editAvatarUpload');
    const editAvatarPreviewImg = document.getElementById('editAvatarPreviewImg');
    const editScaleSlider = document.getElementById('editScaleSlider');
    const editPosXSlider = document.getElementById('editPosXSlider');
    const editPosYSlider = document.getElementById('editPosYSlider');

    if (editScaleSlider && editPosXSlider && editPosYSlider) {
        function updateEditImageTransform() {
            const scale = editScaleSlider.value;
            const posX = editPosXSlider.value;
            const posY = editPosYSlider.value;
            editAvatarPreviewImg.style.transform = `scale(${scale}) translate(${posX}px, ${posY}px)`;
        }

        editScaleSlider.addEventListener('input', updateEditImageTransform);
        editPosXSlider.addEventListener('input', updateEditImageTransform);
        editPosYSlider.addEventListener('input', updateEditImageTransform);

        editAvatarUpload.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    editAvatarPreviewImg.src = e.target.result;
                    // Resetear sliders al cargar nueva imagen
                    editScaleSlider.value = 1;
                    editPosXSlider.value = 0;
                    editPosYSlider.value = 0;
                    updateEditImageTransform();
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });
    }

    // --- RECUPERAR TRANSFORMACIÓN DE AVATAR AL RECARGAR PÁGINA ---
    const savedTransformStr = localStorage.getItem('avatarTransform_{{ user.id }}');
    if (savedTransformStr) {
        try {
            const savedTransform = JSON.parse(savedTransformStr);
            
            // Aplicar a la vista principal
            const mainAvatar = document.getElementById('mainProfileAvatar');
            if (mainAvatar) {
                mainAvatar.style.transform = `scale(${savedTransform.scale}) translate(${savedTransform.mainPosX}px, ${savedTransform.mainPosY}px)`;
            }

            // Aplicar a los sliders y vista de edición
            if (editScaleSlider && editPosXSlider && editPosYSlider && editAvatarPreviewImg) {
                editScaleSlider.value = savedTransform.scale;
                editPosXSlider.value = savedTransform.editPosX;
                editPosYSlider.value = savedTransform.editPosY;
                editAvatarPreviewImg.style.transform = `scale(${savedTransform.scale}) translate(${savedTransform.editPosX}px, ${savedTransform.editPosY}px)`;
            }
        } catch(e) { console.error("Error leyendo transformaciones guardadas", e); }
    }

    // --- CAPTURAR GUARDADO Y ENVIAR AL SERVIDOR REALMENTE CON FETCH ---
    const editProfileForm = document.getElementById('editProfileForm');
    if (editProfileForm) {
        editProfileForm.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            // --- NUEVO: ESTADO DE CARGA Y BLOQUEO DEL BOTÓN ---
            const btnSubmit = editProfileForm.querySelector('button[type="submit"]');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Guardando...';
            // --------------------------------------------------
            
            // Validar contraseñas
            const pass = document.getElementById('editPass').value;
            const passVerify = document.getElementById('editPassVerify').value;
            if (pass && pass !== passVerify) {
                alert("Las contraseñas no coinciden");
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = originalText;
                return;
            }

            // Recolectar datos y archivo
            const formData = new FormData(this);
            if (pass) {
                formData.set('password', pass);
            }

            try {
                // Llamada a routes.py
                const response = await fetch('/api/update_profile', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Guardar los ajustes visuales del zoom localmente
                    const scale = document.getElementById('editScaleSlider').value;
                    const editPosX = document.getElementById('editPosXSlider').value;
                    const editPosY = document.getElementById('editPosYSlider').value;
                    const factor = 200 / 120; // Proporción de la ventana de vista
                    
                    localStorage.setItem('avatarTransform_{{ user.id }}', JSON.stringify({
                        scale: scale,
                        mainPosX: editPosX * factor,
                        mainPosY: editPosY * factor,
                        editPosX: editPosX,
                        editPosY: editPosY
                    }));

                    // RECARGAR PÁGINA PARA DESCARGAR AVATAR NUEVO
                    window.location.reload();
                } else {
                    alert(result.error || "Error al actualizar perfil");
                    btnSubmit.innerHTML = originalText;
                    btnSubmit.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión con el servidor");
                btnSubmit.innerHTML = originalText;
                btnSubmit.disabled = false;
            }
        });
    }
});

// Función global de WhatsApp
function shareToWhatsapp() {
    const info = {
        "Nombre": "{{ user.name }} {{ user.last_name_1 }}",
        "Email": "{{ user.email }}",
        "Teléfono": "{{ user.phone_code or '' }} {{ user.phone or 'No disponible' }}",
        "Rol": "{{ user.role }}",
        "Miembro desde": "{{ user.created_at.strftime('%d/%m/%Y') if user.created_at else '' }}"
    };
    
    if (typeof exportToWhatsapp === 'function') {
        exportToWhatsapp(info, ""); 
    } else {
        console.error("exportToWhatsapp no definida.");
    }
}

// Lógica de Información Adicional Modal Edición
function handleEditDynamicSelect() {
    const select = document.getElementById('editDynamicSelect').value;
    const container = document.getElementById('editDynamicContainer');
    container.innerHTML = ''; // Limpiar previo

    if (select === 'Telefono' || select === 'Whatsapp') {
        const fieldName = select === 'Telefono' ? 'phone' : 'whatsapp';
        container.innerHTML = `
            <div class="input-group">
                <span class="input-group-text glass-input border-end-0 text-orange"><i class="bi bi-phone"></i></span>
                <input type="text" name="${fieldName}" class="form-control glass-input py-2" placeholder="Digite el número telefónico" 
                oninput="this.value = this.value.replace(/[^0-9]/g, '')" maxlength="15">
            </div>
            <small class="text-muted mt-1 d-block ps-2">Solo números permitidos.</small>`;
    } 
    else if (select === 'Facebook' || select === 'Instagram' || select === 'Direccion') {
        const fieldName = select === 'Direccion' ? 'address' : select.toLowerCase();
        container.innerHTML = `
            <div class="input-group mt-2">
                <span class="input-group-text glass-input border-end-0 text-orange"><i class="bi bi-link-45deg"></i></span>
                <input type="url" name="${fieldName}" class="form-control glass-input" placeholder="https://ejemplo.com/perfil">
            </div>`;
    }
    else if (select === 'Fecha') {
        container.innerHTML = `
            <label class="form-label small text-secondary fw-bold">Fecha Especial (Día/Mes/Año)</label>
            <input type="date" name="dob" class="form-control glass-input">`;
    }
    else if (select === 'Institucion') {
        container.innerHTML = `
            <div class="row g-2 mt-1">
                <div class="col-12"><input type="text" name="institution" class="form-control glass-input mb-2" placeholder="Nombre de la Institución/Empresa"></div>
            </div>`;
    }
    else if (select === 'Otro') {
        container.innerHTML = `<input type="text" name="other_info" class="form-control glass-input mt-2" placeholder="Descripción General" style="text-transform: capitalize;">`;
    }
}
</script>
