
<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-lg-10 col-xl-8">
        
        <div class="glass-panel rounded-5 p-4 p-md-5 mb-4 position-relative border-0 shadow-lg">
            <h2 class="fw-bold text-dark mb-5 text-center">
                <i class="bi bi-calendar-plus text-orange me-2"></i>{% if evento %}Editar Evento{% else %}Crear Nuevo Evento{% endif %}
            </h2>
            
            <form id="createEventForm">
                
                <!-- Subir Imagen 9:16 -->
                <div class="text-center mb-5">
                    <label class="form-label fw-bold text-secondary d-block mb-3">Póster del Evento (9:16)</label>
                    <div class="position-relative d-inline-block overflow-hidden rounded-4 border border-4 border-white shadow-sm" style="width: 135px; height: 240px; background: rgba(255,255,255,0.5);">
                        <img id="eventImagePreview" src="{{ url_for('static', filename='default.png') }}" alt="Póster" style="width: 100%; height: 100%; object-fit: cover;">
                        <label for="eventImageUpload" class="btn btn-orange rounded-circle p-2 shadow position-absolute bottom-0 end-0 translate-middle-y me-2" style="cursor: pointer; z-index: 10;">
                            <i class="bi bi-camera-fill text-white"></i>
                        </label>
                        <!-- ATENCIÓN: El name="poster" es vital para SQLite. Filtro de extensiones añadido. -->
                        <input type="file" id="eventImageUpload" name="poster" class="d-none" accept=".png, .jpg, .jpeg, .webp, .gif">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12">
                        <label class="form-label fw-bold text-muted small mb-1">Nombre del Lugar</label>
                        <input type="text" id="nombreLugar" name="nombreLugar" required class="form-control glass-input rounded-3 fw-bold" placeholder="Ej: Cerro Pelado, Parque Nacional Volcán Irazú, etc.">
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted small mb-1">Dificultad</label>
                        <select id="dificultad" name="dificultad" class="form-select glass-input rounded-3">
                            <option value="Paseo">Paseo</option>
                            <option value="Básico">Básico</option>
                            <option value="Intermedio">Intermedio</option>
                            <option value="Dificil">Dificil</option>
                            <option value="Avanzado">Avanzado</option>
                            <option value="Técnico">Técnico</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted small mb-1">Actividad</label>
                        <select id="actividad" name="actividad" class="form-select glass-input rounded-3" onchange="toggleActividad()">
                            <option value="Caminata">Caminata</option>
                            <option value="Internacional">Internacional</option>
                            <option value="Parque Nacional">Parque Nacional</option>
                            <option value="El Camino de Costa Rica">El Camino de Costa Rica</option>
                            <option value="Fiesta">Fiesta</option>
                            <option value="Convivio">Convivio</option>
                            <option value="Reunión">Reunión</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label fw-bold text-muted small mb-1">Moneda</label>
                        <select id="moneda" name="moneda" class="form-select glass-input rounded-3">
                            <option value="¢">Colones (¢)</option>
                            <option value="$">Dólares ($)</option>
                        </select>
                    </div>
                    
                    <div class="col-6 col-md-3">
                        <label class="form-label fw-bold text-muted small mb-1">Precio</label>
                        <input type="number" id="precio" name="precio" required class="form-control glass-input rounded-3" onkeypress="return event.charCode >= 48 && event.charCode <= 57" value="0">
                    </div>

                    <div class="col-6 col-md-3">
                        <label class="form-label fw-bold text-muted small mb-1">Reserva con</label>
                        <input type="number" id="reserva" name="reserva" required class="form-control glass-input rounded-3" onkeypress="return event.charCode >= 48 && event.charCode <= 57" value="0">
                    </div>
                    
                    <div class="col-6 col-md-3">
                        <label class="form-label fw-bold text-muted small mb-1">Capacidad</label>
                        <select id="capacidad" name="capacidad" required class="form-select glass-input rounded-3">
                            <option value="14-17">14-17</option>
                            <option value="17-28">17-28</option>
                            <option value="17-31">17-31</option>
                            <option value="MÁS DE 31">MÁS DE 31</option>
                            <option value="NO APLICA">NO APLICA</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted small mb-1">SINPE</label>
                        <select id="sinpe" name="sinpe" class="form-select glass-input rounded-3">
                            <option>86529837 - Jenny Ceciliano Cordoba</option>
                            <option>87984232 - Jenny Ceciliano Cordoba</option>
                            <option>86227500 - Kenneth Ruiz Matamoros</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label fw-bold text-muted small mb-1">CUENTAS</label>
                        <select id="cuenta" name="cuenta" class="form-select glass-input rounded-3">
                            <option value="Ninguna">-- Ninguna / Solo usar SINPE --</option>
                            <option>Jenny Ceciliano Cordoba (Colones MUCAP) - CR66080402010100715103</option>
                            <option>Jenny Ceciliano Cordoba (Colones BCR) - CR62015202001268129163</option>
                            <option>Kenneth Ruiz Matamoros (Colones MUCAP) - CR19080403012501524778</option>
                            <option>Juan Carlos Ruiz (Colones BCR) - CR61015202001292863793</option>
                            <option>Juan Carlos Ruiz (Dolares BCR) - CR50015202001410361158</option>
                        </select>
                    </div>

                    <!-- NUEVO SWITCH: ZONA DE ALTO RIESGO -->
                    <div class="col-12 mt-3">
                        <div class="form-check form-switch m-0 border border-danger border-opacity-50 rounded-3 p-3 d-flex justify-content-between align-items-center" style="background: rgba(220, 53, 69, 0.05);">
                            <div>
                                <label class="form-check-label fw-bold text-danger mb-0 d-block" for="altoRiesgoToggle" style="cursor: pointer; font-size: 1.05rem;">
                                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Marcar como "Zona de Alto Riesgo"
                                </label>
                                <small class="text-danger opacity-75">Agrega una alerta visual obligatoria sobre la dificultad técnica del terreno.</small>
                            </div>
                            <input class="form-check-input m-0 shadow-sm" type="checkbox" id="altoRiesgoToggle" style="width: 3rem; height: 1.5rem; cursor: pointer;">
                        </div>
                    </div>
                </div>

                <!-- Nacional -->
                <div id="nationalFields" class="glass-table-container p-3 p-md-4 rounded-4 mb-4">
                    
                    <!-- SWITCH: DÍA SEGURO -->
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3 gap-2 border-bottom border-white border-opacity-50 pb-2">
                        <h5 class="fw-bold mb-0 text-warning-custom">Fechas de Actividad</h5>
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input m-0" type="checkbox" id="diaSeguroToggle" onchange="toggleDiaSeguro()" style="width: 2.5rem; height: 1.3rem; cursor: pointer;">
                            <label class="form-check-label fw-bold text-danger small ms-2 mb-0" for="diaSeguroToggle" style="cursor: pointer; padding-top: 1px;">
                                <i class="bi bi-shield-lock-fill me-1"></i>Ocultar Día Exacto
                            </label>
                        </div>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-md-4">
                            <label class="form-label fw-bold text-muted small mb-1">Cantidad de Días</label>
                            <input type="number" id="dias" name="dias" min="1" max="10" value="1" onchange="toggleDateInputs()" class="form-control glass-input rounded-3">
                        </div>
                        
                        <!-- FECHA ÚNICA (DIVIDIDA) -->
                        <div id="singleDateGroup" class="col-12 col-md-8">
                            <label class="form-label fw-bold text-muted small mb-1">Fecha de Actividad</label>
                            <div class="row g-1 date-split">
                                <div class="col-3 normal-day">
                                    <input type="number" id="dayUnica" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                </div>
                                <div class="col-3 secure-day d-none">
                                    <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.85rem;">
                                </div>
                                <div class="col-5">
                                    <select id="monthUnica" class="form-select glass-input rounded-3">
                                        <option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option>
                                        <option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option>
                                        <option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option>
                                        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <input type="number" id="yearUnica" class="form-control glass-input rounded-3" value="2026" min="2024">
                                </div>
                            </div>
                        </div>

                        <!-- RANGO DE FECHAS (DIVIDIDAS) -->
                        <div id="rangeDateGroup" class="col-12 col-md-8 d-none">
                            <div class="row g-2">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label fw-bold text-muted small mb-1">Fecha Inicio</label>
                                    <div class="row g-1 date-split">
                                        <div class="col-3 normal-day">
                                            <input type="number" id="dayInicio" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                        </div>
                                        <div class="col-3 secure-day d-none">
                                            <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.8rem;">
                                        </div>
                                        <div class="col-5">
                                            <select id="monthInicio" class="form-select glass-input rounded-3">
                                                <option value="01">Ene</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Abr</option>
                                                <option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option>
                                                <option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <input type="number" id="yearInicio" class="form-control glass-input rounded-3" value="2026" min="2024">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label fw-bold text-muted small mb-1">Fecha Regreso</label>
                                    <div class="row g-1 date-split">
                                        <div class="col-3 normal-day">
                                            <input type="number" id="dayRegreso" class="form-control glass-input rounded-3" placeholder="Día" min="1" max="31">
                                        </div>
                                        <div class="col-3 secure-day d-none">
                                            <input type="text" class="form-control glass-input rounded-3 text-danger bg-light text-center" value="🔒 Chat" disabled style="font-size:0.8rem;">
                                        </div>
                                        <div class="col-5">
                                            <select id="monthRegreso" class="form-select glass-input rounded-3">
                                                <option value="01">Ene</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Abr</option>
                                                <option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option>
                                                <option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <input type="number" id="yearRegreso" class="form-control glass-input rounded-3" value="2026" min="2024">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SWITCH: LOGÍSTICA SEGURA -->
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-3 mt-4 gap-2 border-bottom border-white border-opacity-50 pb-2">
