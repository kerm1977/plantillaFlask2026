<script>
let _audioPlaying = false;
const _audio = document.getElementById('bgAudio');
if (_audio) {
    _audio.play().then(() => {
        _audioPlaying = true;
        const t = document.getElementById('audioBtnTxt');
        if (t) t.textContent = 'Sonando';
    }).catch(() => {});
}
function toggleAudio() {
    if (!_audio) return;
    const t = document.getElementById('audioBtnTxt');
    if (_audioPlaying) { _audio.pause(); _audioPlaying = false; if (t) t.textContent = 'Sonido'; }
    else { _audio.play(); _audioPlaying = true; if (t) t.textContent = 'Sonando'; }
}
function toggleEditDetalle() {
    const box = document.getElementById('editDetalleBox');
    if (box) box.classList.toggle('d-none');
}
async function saveDetalle(pubId) {
    const val = document.getElementById('editDetalleInput').value.trim();
    if (!val) return;
    const fd = new FormData();
    fd.append('colaborar_detalle', val);
    const res = await fetch(`/api/publicaciones/${pubId}`, {method:'PUT', body:fd});
    const d = await res.json();
    if (d.ok) { document.getElementById('colaborarDetalleText').textContent = val; toggleEditDetalle(); }
    else { alert(d.error || 'Error al guardar'); }
}

function abrirModalMontoRecaudado() {
    const pubId = {{ pub.id }};
    const currentMonto = {{ pub.monto_recaudado or 0 }};
    document.getElementById('montoRecaudadoInput').value = currentMonto;
    const modal = new bootstrap.Modal(document.getElementById('montoRecaudadoModal'));
    modal.show();
}

async function guardarMontoRecaudado() {
    const pubId = {{ pub.id }};
    const monto = parseFloat(document.getElementById('montoRecaudadoInput').value) || 0;
    const justification = document.getElementById('paymentJustificationInput').value.trim();
    
    try {
        const res = await fetch(`/api/publicaciones/${pubId}/monto-recaudado`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ monto: monto, justification: justification })
        });
        const d = await res.json();
        if (d.ok) {
            bootstrap.Modal.getInstance(document.getElementById('montoRecaudadoModal')).hide();
            location.reload();
        } else {
            alert('Error al guardar: ' + (d.error || 'Desconocido'));
        }
    } catch (err) {
        alert('Error de conexión');
    }
}
function compartirEvento() {
    const url = 'https://www.latribu.top' + window.location.pathname;
    const title = {{ pub.nombre | tojson }};
    if (navigator.share) { navigator.share({title, url}); }
    else { navigator.clipboard?.writeText(url).then(() => alert('Enlace copiado: ' + url)); }
}
</script>
