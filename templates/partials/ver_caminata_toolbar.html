  <div id="caminataEditor" class="collapse show">
  {% if is_super %}
  <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('bold')" title="Negrita"><i class="bi bi-type-bold"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('italic')" title="Itálica"><i class="bi bi-type-italic"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('underline')" title="Subrayado"><i class="bi bi-type-underline"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('strikeThrough')" title="Tachado"><i class="bi bi-type-strikethrough"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataClearFormat()" title="Limpiar formato"><i class="bi bi-x-lg"></i></button>
    <select class="form-select form-select-sm glass-input rounded-3 fw-bold text-dark" onchange="caminataTransformarTexto(this.value); this.value=''" title="Mayúsculas/minúsculas" style="width:auto;min-width:5rem;">
      <option value="" selected>ABC</option>
      <option value="uppercase">MAYÚSCULAS</option>
      <option value="lowercase">minúsculas</option>
      <option value="titlecase">Title Case</option>
    </select>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataCapitular()" title="Letra capitular"><i class="bi bi-type-h1"></i></button>
    <select class="form-select form-select-sm glass-input rounded-3 fw-bold text-dark" onchange="caminataInterlineado(this.value); this.value=''" title="Interlineado" style="width:auto;min-width:6rem;">
      <option value="" selected>Interlineado</option>
      <option value="0.8">0.8 (-)</option>
      <option value="1.0">1.0 Normal</option>
      <option value="1.5">1.5 (+)</option>
      <option value="2.0">2.0 (++)</option>
    </select>
    <select id="caminataColorMarcador" class="form-select form-select-sm glass-input rounded-3 fw-bold text-dark" onchange="document.getElementById('caminataIconoMarcador').style.color = this.value;" title="Color de marcador" style="width:auto;min-width:5.5rem;">
      <option value="#ffff99">Amarillo fosfor</option>
      <option value="#99ffff">Celeste fosfor</option>
      <option value="#ff99ff">Rosado fosfor</option>
      <option value="#d0d0d0">Gris fosfor</option>
    </select>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataMarcarSeleccion()" title="Marcar texto"><i class="bi bi-circle-fill" id="caminataIconoMarcador" style="color:#ffff99;"></i></button>
    <div class="vr mx-1"></div>
    <button class="btn btn-sm btn-light rounded-circle caminata-align-button" onclick="caminataExecCmd('justifyLeft')" title="Izquierda" disabled><i class="bi bi-text-left"></i></button>
    <button class="btn btn-sm btn-light rounded-circle caminata-align-button" onclick="caminataExecCmd('justifyCenter')" title="Centro" disabled><i class="bi bi-text-center"></i></button>
    <button class="btn btn-sm btn-light rounded-circle caminata-align-button" onclick="caminataExecCmd('justifyRight')" title="Derecha" disabled><i class="bi bi-text-right"></i></button>
    <button class="btn btn-sm btn-light rounded-circle caminata-align-button" onclick="caminataExecCmd('justifyFull')" title="Justificado" disabled><i class="bi bi-justify"></i></button>
    <div class="vr mx-1"></div>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('insertUnorderedList')" title="Viñetas"><i class="bi bi-list-ul"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('insertOrderedList')" title="Numeración"><i class="bi bi-list-ol"></i></button>
    <div class="vr mx-1"></div>
    <select class="form-select form-select-sm glass-input rounded-3 fw-bold text-dark" onchange="caminataFormatBlock(this.value); this.value='P'" title="Título" style="width:auto;min-width:6rem;">
      <option value="P" selected>Normal</option>
      <option value="H1">Título 1</option>
      <option value="H2">Título 2</option>
      <option value="H3">Título 3</option>
      <option value="H4">Título 4</option>
      <option value="H5">Título 5</option>
      <option value="H6">Título 6</option>
    </select>
    <select id="caminataFuente" class="form-select form-select-sm glass-input rounded-3 fw-bold text-dark" onchange="caminataCambiarFuente(this.value)" title="Fuente" style="width:auto;min-width:6rem;">
      <option value="current">Fuente actual</option>
      <option value="Uncial Antiqua">Bienvenidos a la tribu</option>
      <option value="Ronda">Ronda</option>
    </select>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataCita()" title="Cita"><i class="bi bi-chat-quote"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataWrapTag('code')" title="Código"><i class="bi bi-code"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataInsertarLineaHorizontal()" title="Línea horizontal"><i class="bi bi-dash-lg"></i></button>
    <div class="vr mx-1"></div>
    <button class="btn btn-sm btn-light rounded-circle" onclick="document.getElementById('caminataImageFile').click()" title="Subir imagen"><i class="bi bi-image"></i></button>
    <input type="file" id="caminataImageFile" accept="image/*" style="display:none;" onchange="caminataUploadImage(this)">
    <button class="btn btn-sm btn-light rounded-circle" onclick="document.getElementById('caminataVideoFile').click()" title="Subir video"><i class="bi bi-camera-video"></i></button>
    <input type="file" id="caminataVideoFile" accept="video/*" style="display:none;" onchange="caminataUploadImage(this)">
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataImageAlign('left')" title="Imagen a la izquierda"><i class="bi bi-image"></i><i class="bi bi-arrow-left ms-1 small"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataImageAlign('center')" title="Imagen centrada"><i class="bi bi-image"></i><i class="bi bi-text-center ms-1 small"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataImageAlign('right')" title="Imagen a la derecha"><i class="bi bi-image"></i><i class="bi bi-arrow-right ms-1 small"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataInsertarVideo()" title="Insertar video"><i class="bi bi-film"></i></button>
    <div class="vr mx-1"></div>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('undo')" title="Deshacer"><i class="bi bi-arrow-90deg-left"></i></button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataExecCmd('redo')" title="Rehacer"><i class="bi bi-arrow-90deg-right"></i></button>
    <button id="caminataMultiSelectButton" class="btn btn-sm btn-light rounded-pill" onclick="caminataAlternarMultiseleccion()" title="Activar multiselección"><i class="bi bi-ui-checks me-1"></i>Multiselección</button>
    <button class="btn btn-sm btn-light rounded-circle" onclick="caminataEliminarSeleccion()" title="Eliminar selección"><i class="bi bi-trash"></i></button>
    <div class="vr mx-1"></div>
    <button id="caminataSaveButton" class="btn btn-sm btn-outline-orange rounded-pill" onclick="caminataSave()" title="Guardar"><i id="caminataSaveIcon" class="bi bi-save me-1"></i><span id="caminataSaveLabel">Guardar</span></button>
  </div>
  <div class="text-center mb-2"><span id="caminataSaveStatus" class="small text-muted"></span></div>
  {% endif %}
  </div>
