<div class="modal fade" id="winnerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-trophy-fill text-orange me-2"></i>Anunciar Ganador</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Rifa</label>
                    <select id="winnerRaffleSelect" class="form-select rounded-pill" onchange="resetWinnerSearch()">
                        {% for r in rifas %}
                        <option value="{{ r.id }}" data-name="{{ r.name|e }}">{{ r.name }} (#{{ r.raffle_number }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Número Ganador (00-99)</label>
                    <div class="d-flex gap-2">
                        <input type="text" id="winnerNumber" class="form-control rounded-pill"
                               placeholder="Ej: 07" maxlength="2" oninput="resetWinnerSearch()">
                        <button class="btn btn-orange rounded-pill px-4 flex-shrink-0" onclick="buscarGanador()">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </div>
                </div>
                <div id="winnerResult" class="d-none">
                    <div class="rounded-4 p-3 mb-2" style="background: rgba(255,140,0,0.12); border: 1px solid rgba(255,140,0,0.3);">
                        <h6 class="fw-bold text-orange mb-1"><i class="bi bi-person-check me-1"></i>¡Ganador encontrado!</h6>
                        <p class="mb-1 fw-bold fs-5" id="winnerName"></p>
                        <p class="mb-0 text-secondary small" id="winnerPhone"></p>
                    </div>
                </div>
                <div id="winnerNotFound" class="d-none">
                    <div class="alert alert-warning rounded-4 border-0">
                        <i class="bi bi-exclamation-triangle me-1"></i>Número no encontrado o sin asignar.
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
                <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-orange rounded-pill px-4 py-2 fw-bold d-none" id="saveWinnerBtn" onclick="guardarGanador()">
                    <i class="bi bi-floppy me-1"></i>Guardar
                </button>
                <button class="btn btn-warning-orange rounded-pill px-4 py-2 fw-bold d-none" id="sendCongratBtn" onclick="enviarFelicitaciones()">
                    <i class="bi bi-whatsapp me-1"></i>Enviar Felicitaciones
                </button>
            </div>
        </div>
    </div>
</div>
