<script>
let _pubModal = null;
let _editingPubId = null;

function _getPubModal() {
    if (!_pubModal) {
        const el = document.getElementById('pubModal');
        if (el.parentElement !== document.body) document.body.appendChild(el);
        _pubModal = new bootstrap.Modal(el);
    }
    return _pubModal;
}

function previewImg(input, previewId) {
    const img = document.getElementById(previewId);
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; img.classList.remove('d-none'); };
        reader.readAsDataURL(input.files[0]);
    }
}

function toggleTipoFields() {
    const tipo = document.getElementById('pubTipo').value;
    document.getElementById('fieldsRifa').classList.toggle('d-none', tipo !== 'Rifa');
    document.getElementById('fieldsCaminata').classList.toggle('d-none', tipo !== 'Caminata');
}

function _resetForm() {
    ['pubNombre','pubDesc','pubDireccion','pubUrl','pubLugar','pubPuntoSalida',
     'pubHora','pubRecomendaciones','pubDescCaminata',
     'pubTelefono','pubWhatsapp','pubFacebook','pubInstagram','pubTiktok','pubYoutube',
     'pubColaborarDetalle'].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = '';
    });
    document.getElementById('pubFechaInicio').value = '';
    document.getElementById('pubFechaFin').value = '';
    document.getElementById('pubTipo').value = '';
    document.getElementById('pubAudio').value = '';
    document.getElementById('pubRifaUrl').value = '';
    document.getElementById('pubRifaUrl2').value = '';
    document.getElementById('pubSinpe').value = '';
    document.getElementById('pubCuenta').value = '';
    document.getElementById('pubLogo').value = '';
    document.getElementById('pubFlyer').value = '';
    document.getElementById('prevLogo').classList.add('d-none');
    document.getElementById('prevFlyer').classList.add('d-none');
    document.querySelectorAll('#mostrarChecks input[type=checkbox]').forEach(cb => cb.checked = true);
    toggleTipoFields();
}

function showCreateModal() {
    _editingPubId = null;
    _resetForm();
    document.getElementById('pubModalTitle').innerHTML = '<i class="bi bi-calendar-plus me-2 text-orange"></i>Nuevo Evento';
    document.getElementById('pubSubmitTxt').textContent = 'Guardar Evento';
    document.getElementById('pubFormMsg').innerHTML = '';
    _getPubModal().show();
}

async function editEvento(id) {
    _editingPubId = id;
    const res = await fetch(`/api/publicaciones/${id}`);
    const d = await res.json();
    if (d.error) { alert(d.error); return; }
    document.getElementById('pubNombre').value       = d.nombre || '';
    document.getElementById('pubFechaInicio').value  = d.fecha_inicio || '';
    document.getElementById('pubFechaFin').value     = d.fecha_fin || '';
    document.getElementById('pubDesc').value         = d.descripcion || '';
    document.getElementById('pubAudio').value        = d.audio_filename || '';
    document.getElementById('pubTipo').value         = d.tipo_evento || '';
    document.getElementById('pubRifaUrl').value      = d.rifa_url || '';
    document.getElementById('pubRifaUrl2').value     = d.rifa_url_2 || '';
    document.getElementById('pubLugar').value        = d.lugar || '';
    document.getElementById('pubPuntoSalida').value  = d.punto_salida || '';
    document.getElementById('pubHora').value         = d.hora_encuentro || '';
    document.getElementById('pubRecomendaciones').value = d.recomendaciones || '';
    document.getElementById('pubDescCaminata').value = d.desc_caminata || '';
    document.getElementById('pubDireccion').value    = d.direccion || '';
    document.getElementById('pubUrl').value          = d.url_externa || '';
    document.getElementById('pubSinpe').value        = d.sinpe_info || '';
    document.getElementById('pubCuenta').value       = d.cuenta_info || '';
    document.getElementById('pubColaborarDetalle').value = d.colaborar_detalle || '';
    document.getElementById('pubTelefono').value     = d.telefono || '';
    document.getElementById('pubWhatsapp').value     = d.whatsapp || '';
    document.getElementById('pubFacebook').value     = d.facebook || '';
    document.getElementById('pubInstagram').value    = d.instagram || '';
    document.getElementById('pubTiktok').value       = d.tiktok || '';
    document.getElementById('pubYoutube').value      = d.youtube || '';
    toggleTipoFields();
    // Mostrar checkboxes
    let mostrar = [];
    try { mostrar = JSON.parse(d.mostrar || '[]'); } catch {}
    document.querySelectorAll('#mostrarChecks input[type=checkbox]').forEach(cb => {
        cb.checked = mostrar.includes(cb.value);
    });
    // Image previews
    if (d.logo_filename) {
        const l = document.getElementById('prevLogo');
        l.src = `/static/uploads/publicaciones/${d.logo_filename}`; l.classList.remove('d-none');
    }
    if (d.flyer_filename) {
        const f = document.getElementById('prevFlyer');
        f.src = `/static/uploads/publicaciones/${d.flyer_filename}`; f.classList.remove('d-none');
    }
    document.getElementById('pubModalTitle').innerHTML = '<i class="bi bi-pencil-fill me-2 text-orange"></i>Editar Evento';
    document.getElementById('pubSubmitTxt').textContent = 'Actualizar';
    document.getElementById('pubFormMsg').innerHTML = '';
    _getPubModal().show();
}

async function submitEvento() {
    const nombre = document.getElementById('pubNombre').value.trim();
    const fecha  = document.getElementById('pubFechaInicio').value;
    if (!nombre || !fecha) {
        document.getElementById('pubFormMsg').innerHTML =
            '<div class="alert alert-warning py-2 small">Nombre y fecha son obligatorios.</div>';
        return;
    }
    const mostrar = Array.from(document.querySelectorAll('#mostrarChecks input:checked')).map(c => c.value);
    const fd = new FormData();
    fd.append('nombre',          nombre);
    fd.append('fecha_inicio',    fecha);
    fd.append('fecha_fin',       document.getElementById('pubFechaFin').value);
    fd.append('descripcion',     document.getElementById('pubDesc').value);
    fd.append('audio_filename',  document.getElementById('pubAudio').value);
    fd.append('tipo_evento',     document.getElementById('pubTipo').value);
    fd.append('rifa_url',        document.getElementById('pubRifaUrl').value);
    fd.append('rifa_url_2',      document.getElementById('pubRifaUrl2').value);
    fd.append('lugar',           document.getElementById('pubLugar').value);
    fd.append('punto_salida',    document.getElementById('pubPuntoSalida').value);
    fd.append('hora_encuentro',  document.getElementById('pubHora').value);
    fd.append('recomendaciones', document.getElementById('pubRecomendaciones').value);
    fd.append('desc_caminata',   document.getElementById('pubDescCaminata').value);
    fd.append('direccion',       document.getElementById('pubDireccion').value);
    fd.append('url_externa',     document.getElementById('pubUrl').value);
    fd.append('sinpe_info',      document.getElementById('pubSinpe').value);
    fd.append('cuenta_info',     document.getElementById('pubCuenta').value);
    fd.append('colaborar_detalle', document.getElementById('pubColaborarDetalle').value);
    fd.append('telefono',          document.getElementById('pubTelefono').value);
    fd.append('whatsapp',        document.getElementById('pubWhatsapp').value);
    fd.append('facebook',        document.getElementById('pubFacebook').value);
    fd.append('instagram',       document.getElementById('pubInstagram').value);
    fd.append('tiktok',          document.getElementById('pubTiktok').value);
    fd.append('youtube',         document.getElementById('pubYoutube').value);
    fd.append('mostrar',         JSON.stringify(mostrar));
    const logo  = document.getElementById('pubLogo').files[0];
    const flyer = document.getElementById('pubFlyer').files[0];
    if (logo)  fd.append('logo',  logo);
    if (flyer) fd.append('flyer', flyer);

    const url    = _editingPubId ? `/api/publicaciones/${_editingPubId}` : '/api/publicaciones';
    const method = _editingPubId ? 'PUT' : 'POST';
    const res    = await fetch(url, { method, body: fd });
    const data   = await res.json();
    if (data.ok) {
        bootstrap.Modal.getInstance(document.getElementById('pubModal'))?.hide();
        window.location.reload();
    } else {
        document.getElementById('pubFormMsg').innerHTML =
            `<div class="alert alert-danger py-2 small">${data.error}</div>`;
    }
}

async function deleteEvento(id) {
    if (!confirm('¿Eliminar este evento? Esta acción no se puede deshacer.')) return;
    const res = await fetch(`/api/publicaciones/${id}`, { method: 'DELETE' });
    const d   = await res.json();
    if (d.ok) window.location.reload();
    else alert(d.error || 'Error al eliminar');
}

async function toggleEvento(id, btn) {
    const res = await fetch(`/api/publicaciones/${id}/toggle`, { method: 'POST' });
    const d   = await res.json();
    if (d.ok) window.location.reload();
}
</script>
