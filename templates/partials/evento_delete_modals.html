<!-- Modal Doble Confirmación Eliminar Caminata - Paso 1 -->
<div class="modal fade" id="confirmDeleteEventModal1" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0 shadow-lg">
      <div class="modal-header border-0 pb-3 pt-4 px-4">
        <h5 class="modal-title fw-bold fs-5"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Confirmar eliminación (1/2)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body pt-2 px-4 pb-4 text-center">
        <p class="mb-0">¿Estás seguro de eliminar esta caminata?</p>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2 d-flex justify-content-center">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-warning rounded-pill px-4 fw-bold" onclick="mostrarConfirmarEliminarEvento(2)">Continuar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Doble Confirmación Eliminar Caminata - Paso 2 -->
<div class="modal fade" id="confirmDeleteEventModal2" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0 shadow-lg">
      <div class="modal-header border-0 pb-3 pt-4 px-4">
        <h5 class="modal-title fw-bold fs-5"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Confirmar eliminación (2/2)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body pt-2 px-4 pb-4 text-center">
        <p class="mb-0">¿Realmente deseas eliminarla? Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2 d-flex justify-content-center">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger rounded-pill px-4 fw-bold" onclick="confirmarEliminarEvento()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
