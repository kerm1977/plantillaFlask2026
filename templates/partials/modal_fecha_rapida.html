<!-- Modal de cambio rápido de fecha/estado — solo superusuario.
     Requiere caminatas_2027_script.html (abrirSelectorFecha, confirmarFechaRapida). -->
<style>
  #modalFechaRapida .form-select { text-align: center; font-weight: 600; }
  #mfAviso.ocupado { color: #b35400; }
  #mfAviso.libre { color: #198754; }
  #mfAviso.pasada { color: #dc3545; }
  .mf-estado {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border: 1.5px solid #dee2e6; border-radius: 999px;
    background: #fff; cursor: pointer; font-size: .82rem; font-weight: 600;
    color: #495057; transition: all .15s ease; user-select: none;
  }
  .mf-estado input { position: absolute; opacity: 0; pointer-events: none; }
  .mf-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .mf-estado:hover { border-color: #adb5bd; background: #f8f9fa; }
  .mf-estado:has(input:checked) { border-color: #f58c1f; background: #fff4e8; color: #212529; box-shadow: 0 2px 8px rgba(245,140,31,.25); }
</style>

<div class="modal fade" id="modalFechaRapida" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
    <div class="modal-content rounded-4 shadow">
      <div class="modal-header py-3 border-0">
        <h6 class="modal-title fw-bold text-dark">
          <i class="bi bi-calendar-event me-1" style="color:#f58c1f;"></i>Cambiar fecha
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0 px-4">
        <p id="mfNombre" class="fw-bold text-dark text-truncate mb-3 text-center"></p>
        <div class="row g-3 text-center">
          <div class="col-4">
            <label class="small text-muted d-block mb-1">Día</label>
            <select id="mfDia" class="form-select" onchange="mfValidar()"></select>
          </div>
          <div class="col-4">
            <label class="small text-muted d-block mb-1">Mes</label>
            <select id="mfMes" class="form-select" onchange="mfValidar()"></select>
          </div>
          <div class="col-4">
            <label class="small text-muted d-block mb-1">Año</label>
            <select id="mfAnio" class="form-select" onchange="mfValidar()"></select>
          </div>
        </div>
        <div class="mt-3 text-center">
          <label class="small text-muted d-block mb-1">Duración</label>
          <select id="mfDias" class="form-select"></select>
        </div>
        <div class="mt-3 text-center">
          <label class="small text-muted d-block mb-2">Estado de la caminata</label>
          <div class="d-flex gap-2 justify-content-center flex-wrap">
            <label class="mf-estado"><input type="radio" name="mfEstado" value="" checked><span class="mf-dot" style="background:#198754;"></span>Normal</label>
            <label class="mf-estado"><input type="radio" name="mfEstado" value="suspendida"><span class="mf-dot" style="background:#dc3545;"></span>Suspendida</label>
            <label class="mf-estado"><input type="radio" name="mfEstado" value="lleno"><span class="mf-dot" style="background:#6c757d;"></span>Cupo lleno</label>
          </div>
        </div>
        <p id="mfAviso" class="small text-center mt-3 mb-0 fw-semibold"></p>
      </div>
      <div class="modal-footer py-3 border-0 justify-content-center gap-2">
        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="mfBtnMover" class="btn btn-orange rounded-pill px-4 fw-bold"
                onclick="confirmarFechaRapida()">
          <i class="bi bi-check-lg me-1"></i>Mover aquí
        </button>
      </div>
    </div>
  </div>
</div>
