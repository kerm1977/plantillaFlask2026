<!-- Modal para compartir caminata por WhatsApp -->
<div class="modal fade" id="shareCaminataModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold text-dark"><i class="bi bi-whatsapp text-success me-2"></i>Compartir caminata</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body px-4 pb-3 pt-2">
        <p class="small text-muted mb-2">Personaliza el mensaje. Al final se agregará el enlace automáticamente.</p>
        <textarea id="shareCaminataMensaje" class="form-control glass-input rounded-3" rows="4" placeholder="Escribe tu mensaje..."></textarea>
        <p class="small text-muted mt-2 mb-0 text-truncate"><strong>Enlace:</strong> <span id="shareCaminataEnlace"></span></p>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4 px-4 d-flex justify-content-end gap-2">
        <button type="button" class="btn bg-white shadow-sm rounded-pill px-4 fw-bold" data-bs-dismiss="modal" style="color:#6c757d;border:1px solid #ced4da;">Cancelar</button>
        <button type="button" class="btn btn-success rounded-pill px-4 fw-bold" onclick="compartirCaminataPorWhatsApp()"><i class="bi bi-whatsapp me-2"></i>Enviar por WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal para insertar video -->
<div class="modal fade" id="insertarVideoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold text-dark"><i class="bi bi-film me-2" style="color:#ff8c00;"></i>Insertar video</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body px-4 pb-3 pt-2">
        <p class="small text-muted mb-2">Pega el enlace del video de YouTube o Facebook.</p>
        <input type="url" id="insertarVideoUrl" class="form-control glass-input rounded-3" placeholder="https://www.youtube.com/watch?v=...">
        <div id="insertarVideoFeedback" class="small text-danger mt-2" style="display:none;"></div>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4 px-4 d-flex justify-content-end gap-2">
        <button type="button" class="btn bg-white shadow-sm rounded-pill px-4 fw-bold" data-bs-dismiss="modal" style="color:#6c757d;border:1px solid #ced4da;">Cancelar</button>
        <button type="button" class="btn btn-success rounded-pill px-4 fw-bold" onclick="insertarVideoDesdeModal()"><i class="bi bi-plus-circle me-2"></i>Insertar</button>
      </div>
    </div>
  </div>
</div>
