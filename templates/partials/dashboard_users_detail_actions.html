<script>
function showUsersList() {
    currentSelectedUserId = null; currentSelectedUserName = ""; currentSelectedUserObj = null;
    document.getElementById('adminUserDetails').classList.add('d-none');
    document.getElementById('adminUsersList').classList.remove('d-none');
}

function dashOptionCreateUser() {
    const modalEl = document.getElementById('crearUsuarioModal');
    if (modalEl) new bootstrap.Modal(modalEl).show();
}

function dashOptionEditUser() {
    if (!currentSelectedUserObj) {
        mostrarAlerta('Abra la ficha de un usuario para editarlo.', 'warning');
        return;
    }
    if (currentSelectedUserObj.type === 'hiker') {
        const cedula = currentSelectedUserObj.crm_cedula;
        if (cedula) window.location.href = `/editar_caminante/${cedula}`;
        else mostrarAlerta('Este registro CRM no tiene cédula editable.', 'warning');
        return;
    }
    openEditUserModal();
}

function dashOptionDeleteUser() {
    confirmDeleteUser();
}

function openEditUserModal() {
    if (!currentSelectedUserObj) {
        mostrarAlerta('Abra la ficha de un usuario para editarlo.', 'warning');
        return;
    }
    if (currentSelectedUserObj.type === 'hiker') {
        const cedula = currentSelectedUserObj.crm_cedula;
        if (cedula) window.location.href = `/editar_caminante/${cedula}`;
        else mostrarAlerta('Este registro CRM no tiene cédula editable.', 'warning');
        return;
    }
    document.getElementById('editName').value       = currentSelectedUserObj.name;
    document.getElementById('editLastName1').value  = currentSelectedUserObj.last_name_1;
    document.getElementById('editLastName2').value  = currentSelectedUserObj.last_name_2;
    document.getElementById('editEmail').value      = currentSelectedUserObj.email;
    const editRole = document.getElementById('editRole');
    if (editRole) editRole.value = currentSelectedUserObj.role;
    const avatarPath = currentSelectedUserObj.avatar && currentSelectedUserObj.avatar.startsWith('uploads')
        ? currentSelectedUserObj.avatar : (currentSelectedUserObj.avatar === 'default.png' ? 'default.png' : 'uploads/' + currentSelectedUserObj.avatar);
    document.getElementById('editAvatarPreviewImg').src = "/static/" + avatarPath;
    const dynSelect = document.getElementById('editDynamicSelect');
    const dynContainer = document.getElementById('editDynamicContainer');
    if (currentSelectedUserObj.phone && currentSelectedUserObj.phone !== "No registrado") {
        dynSelect.value = 'Telefono';
        dynContainer.innerHTML = `<div class="mb-2"><span class="text-orange me-2"><i class="bi bi-phone"></i></span>
            <input type="tel" name="phone" class="input-bulma" placeholder="Digite el número telefónico" inputmode="numeric" pattern="[0-9]*"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="15" value="${currentSelectedUserObj.phone.replace(/[^0-9]/g, '')}"></div>
            <small class="text-muted d-block ps-2">Solo números permitidos.</small>`;
    } else { dynSelect.value = ''; dynContainer.innerHTML = ''; }

    // Precargar Información del Caminante (CRM)
    const editCedulaField = document.getElementById('editCedula');
    const cedulaValue = (currentSelectedUserObj.crm_cedula || '').replace(/[^0-9]/g,'');
    editCedulaField.value = cedulaValue;
    editCedulaField.readOnly = cedulaValue.length > 0;
    toggleCedulaLock('adminEditUserForm', 'editCedula');
    document.getElementById('editPasaporte').value    = currentSelectedUserObj.crm_pasaporte || '';

    const fNac = currentSelectedUserObj.crm_fecha_nac || currentSelectedUserObj.dob || '';
    document.getElementById('editDia').value  = '';
    document.getElementById('editMes').value  = '';
    document.getElementById('editAnio').value = '';
    if (fNac && /^\d{4}-\d{2}-\d{2}$/.test(fNac)) {
        const [anio, mes, dia] = fNac.split('-');
        document.getElementById('editDia').value  = dia;
        document.getElementById('editMes').value  = mes;
        document.getElementById('editAnio').value = anio;
    }

    document.getElementById('editSangre').value       = currentSelectedUserObj.crm_tipo_sangre || '';
    document.getElementById('editAlergias').value     = currentSelectedUserObj.crm_alergias || '';
    document.getElementById('editEnfermedades').value = currentSelectedUserObj.crm_enfermedades || '';

    // Contactos de emergencia (separados por ' | ')
    const emergencyContainer = document.getElementById('editEmergencyContainer');
    const nombresRaw = currentSelectedUserObj.crm_emergencia_nombre || '';
    const telefonosRaw = currentSelectedUserObj.crm_emergencia_tel || '';
    const nombres = nombresRaw ? nombresRaw.split(' | ').map(s => s.trim()).filter(Boolean) : [];
    const telefonos = telefonosRaw ? telefonosRaw.split(' | ').map(s => s.trim()).filter(Boolean) : [];
    emergencyContainer.innerHTML = '';
    if (nombres.length || telefonos.length) {
        const maxRows = Math.max(nombres.length, telefonos.length, 1);
        for (let i = 0; i < maxRows; i++) {
            emergencyContainer.insertAdjacentHTML('beforeend', buildEditEmergencyRow(nombres[i] || '', telefonos[i] || ''));
        }
    } else {
        emergencyContainer.innerHTML = buildEditEmergencyRow('', '');
    }

    // Reiniciar campo de contraseña
    const passWrapper = document.getElementById('editPassWrapper');
    const passTrigger = document.getElementById('editPassTrigger');
    const passInput   = document.getElementById('editPass');
    if (passWrapper) passWrapper.classList.add('d-none');
    if (passTrigger) passTrigger.classList.remove('d-none');
    if (passInput) passInput.value = '';

    new bootstrap.Modal(document.getElementById('adminEditUserModal')).show();
}

function handleEditDynamicSelect() {
    const select    = document.getElementById('editDynamicSelect').value;
    const container = document.getElementById('editDynamicContainer');
    container.innerHTML = '';
    if (select === 'Telefono' || select === 'Whatsapp') {
        container.innerHTML = `<div class="mb-2"><span class="text-orange me-2"><i class="bi bi-phone"></i></span>
            <input type="tel" name="phone" class="input-bulma" placeholder="Digite el número telefónico" inputmode="numeric" pattern="[0-9]*"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="15"></div>
            <small class="text-muted d-block ps-2">Solo números permitidos.</small>`;
    } else if (select === 'Facebook' || select === 'Instagram' || select === 'Direccion') {
        const fieldName = select === 'Direccion' ? 'address' : select.toLowerCase();
        container.innerHTML = `<div class="mt-2"><span class="text-orange me-2"><i class="bi bi-link-45deg"></i></span>
            <input type="url" name="${fieldName}" class="input-bulma" placeholder="https://ejemplo.com/perfil"></div>`;
    } else if (select === 'Fecha') {
        container.innerHTML = `<label class="label-bulma" style="font-size:0.85rem;">Fecha Especial</label>
            <input type="date" name="dob" class="input-bulma">`;
    } else if (select === 'Institucion') {
        container.innerHTML = `<input type="text" name="institution" class="input-bulma mb-2" placeholder="Nombre de la Institución/Empresa">`;
    } else if (select === 'Otro') {
        container.innerHTML = `<input type="text" name="other_info" class="input-bulma mt-2" placeholder="Descripción General" style="text-transform:capitalize;">`;
    }
}

function buildEditEmergencyRow(nombre, telefono) {
    return `<div class="edit-emergency-row row g-3 mb-3 align-items-end">
        <div class="col-md-5">
            <label class="label-bulma" style="font-size:0.85rem;">Contacto de Emergencia</label>
            <input type="text" name="contacto_emergencia_nombre[]" class="input-bulma" placeholder="Ej: María (Esposa)" value="${nombre ? nombre.replace(/"/g, '&quot;') : ''}">
        </div>
        <div class="col-md-5">
            <label class="label-bulma" style="font-size:0.85rem;">Teléfono del Contacto</label>
            <input type="tel" name="contacto_emergencia_telefono[]" class="input-bulma" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="88889999" value="${telefono ? telefono.replace(/[^0-9]/g,'') : ''}">
        </div>
        <div class="col-md-2 text-end">
            <button type="button" class="btn btn-outline-danger btn-sm rounded-pill" onclick="this.closest('.edit-emergency-row').remove()" title="Quitar contacto"><i class="bi bi-x-lg"></i></button>
        </div>
    </div>`;
}

function addEditEmergencyContact() {
    const container = document.getElementById('editEmergencyContainer');
    container.insertAdjacentHTML('beforeend', buildEditEmergencyRow('', ''));
}

async function toggleUserStatus() {
    if (!currentSelectedUserId) return;
    try {
        const response = await fetch(`/api/admin/toggle_status/${currentSelectedUserId}`, { method: 'POST' });
        const result   = await response.json();
        if (response.ok && result.success) {
            mostrarAlerta(`El estado del usuario ahora es: ${result.new_status}`, 'warning');
            showUsersList(); loadAllUsers();
        } else { mostrarAlerta(result.error || "No se pudo cambiar el estado del usuario.", 'error'); }
    } catch(err) { mostrarAlerta("Error de red al intentar comunicarse con el servidor.", 'error'); }
}

let _tripleConfirmStep = 0;
let _tripleConfirmCallback = null;

function _initTripleConfirmModal() {
    const modalEl = document.getElementById('tripleConfirmDeleteModal');
    if (!modalEl) return null;
    return bootstrap.Modal.getOrCreateInstance(modalEl);
}

function _actualizarTripleConfirm(nombre) {
    const titleEl = document.getElementById('tripleConfirmTitle');
    const msgEl = document.getElementById('tripleConfirmMessage');
    const inputGroup = document.getElementById('tripleConfirmInputGroup');
    const input = document.getElementById('tripleConfirmInput');
    const btn = document.getElementById('tripleConfirmBtn');
    if (titleEl) titleEl.textContent = `Paso ${_tripleConfirmStep} de 3`;
    if (input) input.value = '';
    if (inputGroup) inputGroup.classList.add('d-none');
    if (btn) {
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-outline-danger');
        btn.textContent = 'Continuar';
        btn.disabled = false;
    }
    if (_tripleConfirmStep === 1 && msgEl) {
        msgEl.innerHTML = `¿Seguro que deseas eliminar a <strong>${nombre}</strong>?`;
    } else if (_tripleConfirmStep === 2 && msgEl) {
        msgEl.innerHTML = `¿Realmente deseas eliminar a <strong>${nombre}</strong>?`;
    } else if (msgEl) {
        msgEl.innerHTML = `Esta acción es irreversible. Escribe <strong>ELIMINAR</strong> para confirmar.`;
        if (inputGroup) inputGroup.classList.remove('d-none');
        if (btn) {
            btn.classList.remove('btn-outline-danger');
            btn.classList.add('btn-danger');
            btn.textContent = 'Eliminar definitivamente';
        }
    }
}

function abrirTripleConfirmEliminar(nombre, onFinal) {
    const modal = _initTripleConfirmModal();
    if (!modal) return;
    _tripleConfirmStep = 1;
    _tripleConfirmCallback = onFinal;
    _actualizarTripleConfirm(nombre);
    modal.show();
}

function avanzarTripleConfirm() {
    const nombre = currentSelectedUserName || 'este contacto';
    const input = document.getElementById('tripleConfirmInput');
    if (_tripleConfirmStep === 3) {
        if (!input || input.value.trim().toUpperCase() !== 'ELIMINAR') {
            mostrarAlerta('Debes escribir ELIMINAR para confirmar.', 'warning');
            return;
        }
        const modal = _initTripleConfirmModal();
        if (typeof _tripleConfirmCallback === 'function') _tripleConfirmCallback();
        if (modal) modal.hide();
        return;
    }
    _tripleConfirmStep++;
    _actualizarTripleConfirm(nombre);
}

async function _ejecutarEliminacionUsuario() {
    const btn = document.getElementById('tripleConfirmBtn');
    const original = btn ? btn.innerHTML : '';
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Eliminando...';
    }
    try {
        const response = await fetch(`/api/admin/delete_user/${currentSelectedUserId}`, { method: 'DELETE' });
        const result = await response.json();
        if (response.ok && result.success) {
            const modal = _initTripleConfirmModal();
            if (modal) modal.hide();
            mostrarAlerta('Usuario eliminado permanentemente.', 'success');
            showUsersList(); loadAllUsers();
        } else {
            mostrarAlerta(result.error || 'No se pudo eliminar el usuario.', 'error');
        }
    } catch(err) { mostrarAlerta('Error al intentar eliminar el usuario.', 'error'); }
    finally { if (btn) { btn.disabled = false; btn.innerHTML = original; } }
}

function confirmDeleteUser() {
    if (!currentSelectedUserId) {
        mostrarAlerta('Abra la ficha de un usuario registrado para eliminarlo.', 'warning');
        return;
    }
    abrirTripleConfirmEliminar(currentSelectedUserName || 'este contacto', _ejecutarEliminacionUsuario);
}
</script>
