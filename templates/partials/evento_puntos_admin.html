          {% if is_super %}
          <div class="accordion-item glass-table-container border-0 rounded-4 mb-2 overflow-hidden">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed fw-bold text-dark" type="button" data-bs-toggle="collapse" data-bs-target="#accRegalar">
                <i class="bi bi-heart me-2"></i>Regalar puntos a participantes
              </button>
            </h2>
            <div id="accRegalar" class="accordion-collapse collapse" data-bs-parent="#puntosAccordion">
              <div class="accordion-body">
                <p class="small text-muted">Seleccioná un participante y el monto para regalarle puntos.</p>
                <form method="post" action="{{ url_for('main.evento_puntos', event_id=event.id) }}" class="row g-2" onsubmit="return confirm('¿Estás seguro de regalar estos puntos?');">
                  <input type="hidden" name="cedula" value="{{ cedula }}">
                  <input type="hidden" name="accion" value="regalar">
                  <div class="col-5">
                    <select name="cedula_destino" class="form-select" data-searchable required>
                      <option value="" disabled selected>Seleccioná un participante</option>
                      {% for p in participantes %}
                      <option value="{{ p.cedula }}" data-search="{{ ((p.nombre_completo or '') ~ ' ' ~ (p.cedula or '') ~ ' ' ~ (p.pasaporte or '') ~ ' ' ~ (p.tipo_sangre or '') ~ ' ' ~ (p.telefono or '') ~ ' ' ~ (p.contacto_emergencia_nombre or '') ~ ' ' ~ (p.contacto_emergencia_telefono or '') ~ ' ' ~ (p.alergias or '') ~ ' ' ~ (p.enfermedades_cronicas or '') ~ ' ' ~ (p.pin_secreto or '')) | replace('"', '') }}">{{ p.nombre_completo }} ({{ p.cedula }})</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="col-4">
                    <input type="number" name="monto" class="form-control" placeholder="Puntos" min="1" required>
                  </div>
                  <div class="col-3">
                    <button type="submit" class="btn btn-success w-100 fw-bold">Regalar</button>
                  </div>
                  <div class="col-12 mt-2">
                    <input type="text" name="motivo" class="form-control" placeholder="Motivo del obsequio (ej. cumpleaños, buen desempeño)" maxlength="200">
                  </div>
                </form>
            </div>
          </div>
          {% endif %}

        </div>
