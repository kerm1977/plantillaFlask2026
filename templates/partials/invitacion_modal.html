<!-- Modal: invitación personalizada 9:16 por WhatsApp (superusuario) -->
<div class="modal fade" id="invitacionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-envelope-paper me-2 text-success"></i>Invitación personalizada</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label fw-bold small">Evento</label>
            <select id="invEvento" class="form-select" onchange="Invitacion.actualizar()">
              <option value="">Cargando eventos...</option>
            </select>
            <label class="form-label fw-bold small mt-3">Persona a invitar</label>
            <input type="search" id="invBuscar" class="form-control" placeholder="Buscar por nombre o cédula..."
                   autocomplete="off" oninput="Invitacion.filtrar()">
            <input type="hidden" id="invCedula">
            <div id="invLista" class="list-group mt-1" style="max-height:180px;overflow-y:auto;"></div>
            <label class="form-label fw-bold small mt-3">Invitaciones recientes</label>
            <div id="invFavs" class="d-flex flex-wrap gap-1"></div>
            <p class="small text-muted mt-2 mb-0" id="invResumen"></p>
          </div>
          <div class="col-12 col-md-6 text-center">
            <div id="invPreview" class="border rounded-4 bg-light d-flex align-items-center justify-content-center" style="min-height:340px;overflow:hidden;">
              <span class="text-muted small">Elegí evento y persona para ver la invitación</span>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill mt-2" data-bs-toggle="collapse" data-bs-target="#invAjustes">
              <i class="bi bi-sliders me-1"></i>Ajustar diseño
            </button>
            <div class="collapse text-start" id="invAjustes">
              <div class="border rounded-3 mt-2 p-2 small" style="max-height:200px;overflow-y:auto;">
                <label class="form-label mb-0 d-flex justify-content-between">Posición del texto <span id="invPosVal">62%</span></label>
                <input type="range" class="form-range" id="invPos" min="30" max="92" value="62" oninput="Invitacion.ajuste()">
                <label class="form-label mb-0 d-flex justify-content-between">Difuminado (inicio) <span id="invBandVal">58%</span></label>
                <input type="range" class="form-range" id="invBand" min="10" max="92" value="58" oninput="Invitacion.ajuste()">
                <label class="form-label mb-0 d-flex justify-content-between">Desenfoque del fondo <span id="invBlurVal">0%</span></label>
                <input type="range" class="form-range" id="invBlur" min="0" max="100" value="0" oninput="Invitacion.ajuste()">
                <label class="form-label mb-0 d-flex justify-content-between">Tamaño del nombre <span id="invFnombreVal">100%</span></label>
                <input type="range" class="form-range" id="invFnombre" min="50" max="200" value="100" oninput="Invitacion.ajuste()">
                <label class="form-label mb-0 d-flex justify-content-between">Tamaño de la información <span id="invFinfoVal">100%</span></label>
                <input type="range" class="form-range" id="invFinfo" min="50" max="200" value="100" oninput="Invitacion.ajuste()">
                <label class="form-label mb-0 d-flex justify-content-between">Tamaño del botón de puntos <span id="invFbotonVal">100%</span></label>
                <input type="range" class="form-range" id="invFboton" min="50" max="200" value="100" oninput="Invitacion.ajuste()">
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill fw-bold" data-bs-dismiss="modal">Cancelar</button>
        <a href="#" id="invDescargar" class="btn btn-outline-primary rounded-pill fw-bold" download="invitacion.png" onclick="Invitacion.usada()"><i class="bi bi-download me-1"></i>Descargar</a>
        <button type="button" id="invWhatsapp" class="btn btn-success rounded-pill fw-bold" onclick="Invitacion.whatsapp()"><i class="bi bi-whatsapp me-1"></i>WhatsApp</button>
      </div>
    </div>
  </div>
</div>
