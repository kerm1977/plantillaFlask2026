<script>
let currentFormId = null;
let currentFormSlug = null;
let fields = [];

// ============================
// LISTA DE FORMULARIOS
// ============================
async function loadForms() {
    const res = await fetch('/api/forms');
    const data = await res.json();
    const container = document.getElementById('formsList');
    if (!data.length) {
        container.innerHTML = `<div class="col-12 text-center text-muted py-5">
            <i class="bi bi-inbox fs-1 d-block mb-2"></i>No hay formularios creados aún.</div>`;
        return;
    }
    container.innerHTML = data.map(f => {
        const accent = f.form_type === 'examen' ? '#ff8c00' : '#0d6efd';
        const typeIcon = f.form_type === 'examen' ? 'bi-pencil-square' : 'bi-clipboard-data';
        const typeLabel = f.form_type === 'examen' ? 'Examen' : 'Registro';
        return `
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="rounded-4 h-100 d-flex flex-column overflow-hidden" style="background: rgba(255,255,255,0.55); border-left: 4px solid ${accent}; border-top: 1px solid rgba(255,255,255,0.7); border-right: 1px solid rgba(255,255,255,0.5); border-bottom: 1px solid rgba(255,255,255,0.5); transition: transform 0.2s ease;" onmouseenter="this.style.transform='translateY(-3px)'" onmouseleave="this.style.transform='none'">
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <!-- Encabezado -->
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="d-flex align-items-center gap-2" style="min-width:0;">
                            <div class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0" style="width:36px; height:36px; background:${accent}15;">
                                <i class="bi ${typeIcon}" style="color:${accent}; font-size:1.1rem;"></i>
                            </div>
                            <div style="min-width:0;">
                                <h6 class="fw-bold mb-0 text-truncate" style="font-size:0.95rem;">${f.name}</h6>
                                <div class="d-flex align-items-center gap-1 mt-1">
                                    <span class="badge rounded-pill" style="font-size:0.65rem; background:${accent}20; color:${accent}; border:1px solid ${accent}40;">${typeLabel}</span>
                                    <span class="badge rounded-pill ${f.is_active ? 'bg-success' : 'bg-secondary'} bg-opacity-10 ${f.is_active ? 'text-success' : 'text-secondary'}" style="font-size:0.65rem; border:1px solid ${f.is_active ? 'rgba(25,135,84,0.3)' : 'rgba(108,117,125,0.3)'};">${f.is_active ? 'Activo' : 'Cerrado'}</span>
                                </div>
                            </div>
                        </div>
                        ${f.responses_count > 0 ? `<span class="badge bg-danger rounded-pill d-flex align-items-center justify-content-center flex-shrink-0" style="width:28px; height:28px; font-size:0.8rem;">${f.responses_count}</span>` : ''}
                    </div>

                    <!-- Info -->
                    <div class="d-flex flex-wrap gap-3 mt-1 mb-2" style="font-size:0.78rem; color:#6c757d;">
                        <span><i class="bi bi-calendar3 me-1"></i>${f.created_at}</span>
                        <span><i class="bi bi-list-check me-1"></i>${f.fields_count} preguntas</span>
                    </div>

                    <!-- Link -->
                    <div class="rounded-3 px-2 py-1 mb-2 d-flex align-items-center" style="background:rgba(13,110,253,0.06); font-size:0.75rem;">
                        <i class="bi bi-link-45deg me-1" style="color:${accent};"></i>
                        <span class="text-truncate" style="color:#495057;">/form/${f.slug}</span>
                    </div>

                    <!-- Botones -->
                    <div class="mt-auto pt-2 d-flex gap-1 flex-wrap border-top" style="border-color: rgba(0,0,0,0.06) !important;">
                        <button class="btn btn-sm rounded-pill px-2 py-1" style="font-size:0.75rem; background:rgba(13,110,253,0.08); color:#0d6efd; border:1px solid rgba(13,110,253,0.15);" onclick="editForm(${f.id})" title="Editar"><i class="bi bi-pencil me-1"></i>Editar</button>
                        <button class="btn btn-sm rounded-pill px-2 py-1" style="font-size:0.75rem; background:rgba(25,135,84,0.08); color:#198754; border:1px solid rgba(25,135,84,0.15);" onclick="viewResponses(${f.id})" title="Respuestas"><i class="bi bi-eye me-1"></i>${f.responses_count}</button>
                        <button class="btn btn-sm rounded-pill px-2 py-1" style="font-size:0.75rem; background:rgba(108,117,125,0.08); color:#6c757d; border:1px solid rgba(108,117,125,0.15);" onclick="copyLink('${f.slug}')" title="Copiar Link"><i class="bi bi-share"></i></button>
                        <a href="/form/${f.slug}" target="_blank" class="btn btn-sm rounded-pill px-2 py-1" style="font-size:0.75rem; background:rgba(13,202,240,0.08); color:#0dcaf0; border:1px solid rgba(13,202,240,0.15);" title="Abrir"><i class="bi bi-box-arrow-up-right"></i></a>
                        <button class="btn btn-sm rounded-pill px-2 py-1 ms-auto" style="font-size:0.75rem; background:rgba(220,53,69,0.08); color:#dc3545; border:1px solid rgba(220,53,69,0.15);" onclick="deleteForm(${f.id})" title="Eliminar"><i class="bi bi-trash3"></i></button>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function backToList() {
    document.getElementById('formEditor').classList.add('d-none');
    document.getElementById('responsesViewer').classList.add('d-none');
    document.getElementById('formsList').classList.remove('d-none');
    loadForms();
}

// ============================
// CREAR / EDITAR FORMULARIO
// ============================
function showCreateForm() {
    currentFormId = null;
    currentFormSlug = null;
    fields = [];
    document.getElementById('formName').value = '';
    document.getElementById('formType').value = 'registro';
    document.getElementById('formAllowEdit').value = 'false';
    document.getElementById('trigNombre').checked = true;
    document.getElementById('trigFecha').checked = false;
    document.getElementById('trigEmail').checked = false;
    document.getElementById('trigEdad').checked = false;
    document.getElementById('trigTelefono').checked = false;
    renderFields();
    updatePreview();
    document.getElementById('formsList').classList.add('d-none');
    document.getElementById('formEditor').classList.remove('d-none');
}

async function editForm(id) {
    const res = await fetch(`/api/forms/${id}`);
    const form = await res.json();
    currentFormId = id;
    currentFormSlug = form.slug;
    document.getElementById('formName').value = form.name;
    document.getElementById('formType').value = form.form_type;
    document.getElementById('formAllowEdit').value = form.allow_edit ? 'true' : 'false';
    document.getElementById('trigNombre').checked = form.show_nombre;
    document.getElementById('trigFecha').checked = form.show_fecha;
    document.getElementById('trigEmail').checked = form.show_email;
    document.getElementById('trigEdad').checked = form.show_edad;
    document.getElementById('trigTelefono').checked = form.show_telefono;
    fields = form.fields.map(f => ({...f}));
    renderFields();
    updatePreview();
    document.getElementById('formsList').classList.add('d-none');
    document.getElementById('formEditor').classList.remove('d-none');
}

async function saveForm() {
    const payload = {
        name: document.getElementById('formName').value.trim() || 'Sin título',
        form_type: document.getElementById('formType').value,
        allow_edit: document.getElementById('formAllowEdit').value === 'true',
        show_nombre: document.getElementById('trigNombre').checked,
        show_fecha: document.getElementById('trigFecha').checked,
        show_email: document.getElementById('trigEmail').checked,
        show_edad: document.getElementById('trigEdad').checked,
        show_telefono: document.getElementById('trigTelefono').checked,
    };

    let formId = currentFormId;
    if (!formId) {
        const res = await fetch('/api/forms', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!data.ok) { alert(data.error || 'Error'); return; }
        formId = data.id;
        currentFormId = formId;
        currentFormSlug = data.slug;
    } else {
        await fetch(`/api/forms/${formId}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    }

    // Guardar campos
    await fetch(`/api/forms/${formId}/fields`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ fields: fields })
    });

    alert('✅ Formulario guardado correctamente');
    backToList();
}

async function deleteForm(id) {
    if (!confirm('¿Eliminar este formulario y todas sus respuestas?')) return;
    await fetch(`/api/forms/${id}`, { method: 'DELETE' });
    loadForms();
}

function copyLink(slug) {
    const url = `${window.location.origin}/form/${slug}`;
    navigator.clipboard.writeText(url).then(() => alert('📋 Link copiado:\n' + url));
}

// ============================
// CONSTRUCTOR DE CAMPOS
// ============================
function addField(type) {
    fields.push({ field_type: type, label: '', options: [], correct_answer: '' });
    renderFields();
    updatePreview();
}

function removeField(index) {
    fields.splice(index, 1);
    renderFields();
    updatePreview();
}

function moveField(index, dir) {
    const newIdx = index + dir;
    if (newIdx < 0 || newIdx >= fields.length) return;
    [fields[index], fields[newIdx]] = [fields[newIdx], fields[index]];
    renderFields();
    updatePreview();
}

function renderFields() {
    const container = document.getElementById('fieldsContainer');
    const isExamen = document.getElementById('formType').value === 'examen';

    container.innerHTML = fields.map((f, i) => {
        let optionsHtml = '';
        if (f.field_type === 'radio' || f.field_type === 'checkbox') {
            const opts = (f.options || []).map((o, oi) => `
                <div class="input-group input-group-sm mb-1">
                    <input type="text" class="form-control" value="${o}" onchange="updateOption(${i}, ${oi}, this.value); updatePreview()" placeholder="Opción ${oi+1}">
                    <button class="btn btn-outline-danger" onclick="removeOption(${i}, ${oi}); updatePreview()"><i class="bi bi-x"></i></button>
                </div>
            `).join('');
            optionsHtml = `
                <div class="mt-2 ms-3">
                    <small class="text-muted fw-semibold">Opciones:</small>
                    ${opts}
                    <button class="btn btn-sm btn-outline-secondary rounded-pill mt-1" onclick="addOption(${i}); updatePreview()"><i class="bi bi-plus"></i> Opción</button>
                </div>`;
        }

        let correctHtml = '';
        if (isExamen && f.field_type !== 'file') {
            correctHtml = `
                <div class="mt-2 ms-3">
                    <small class="text-success fw-semibold"><i class="bi bi-check-circle me-1"></i>Respuesta correcta:</small>
                    <input type="text" class="form-control form-control-sm mt-1" value="${f.correct_answer || ''}" 
                           onchange="fields[${i}].correct_answer = this.value" 
                           placeholder="${f.field_type === 'checkbox' ? 'Separar con comas: Opción1, Opción2' : 'Respuesta correcta'}">
                </div>`;
        }

        return `
        <div class="border rounded-3 p-2 mb-2 bg-white">
            <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                <select class="form-select form-select-sm py-0" style="max-width:160px;font-size:0.72rem;height:26px;" onchange="changeFieldType(${i}, this.value)">
                    <option value="text"     ${f.field_type==='text'     ?'selected':''}>📝 Resp. corta</option>
                    <option value="textarea" ${f.field_type==='textarea' ?'selected':''}>📄 Resp. larga</option>
                    <option value="radio"    ${f.field_type==='radio'    ?'selected':''}>🔘 Única selección</option>
                    <option value="checkbox" ${f.field_type==='checkbox' ?'selected':''}>☑️ Múltiple selección</option>
                    <option value="file"     ${f.field_type==='file'     ?'selected':''}>📎 Archivo</option>
                </select>
                <span class="text-muted" style="font-size: 0.7rem;">#${i+1}</span>
                <div class="ms-auto d-flex gap-1">
                    <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="moveField(${i}, -1)" ${i===0?'disabled':''}><i class="bi bi-arrow-up" style="font-size:0.7rem;"></i></button>
                    <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="moveField(${i}, 1)" ${i===fields.length-1?'disabled':''}><i class="bi bi-arrow-down" style="font-size:0.7rem;"></i></button>
                    <button class="btn btn-sm btn-outline-danger py-0 px-1" onclick="removeField(${i})"><i class="bi bi-trash3" style="font-size:0.7rem;"></i></button>
                </div>
            </div>
            <input type="text" class="form-control form-control-sm" value="${f.label}" 
                   onchange="fields[${i}].label = this.value; updatePreview()" 
                   oninput="fields[${i}].label = this.value; updatePreview()" 
                   placeholder="Escribir la pregunta...">
            ${optionsHtml}
            ${correctHtml}
        </div>`;
    }).join('');
}

function changeFieldType(index, newType) {
    const keepOpts = (newType === 'radio' || newType === 'checkbox') &&
                     (fields[index].field_type === 'radio' || fields[index].field_type === 'checkbox');
    fields[index].field_type = newType;
    if (!keepOpts) fields[index].options = [];
    fields[index].correct_answer = '';
    renderFields();
    updatePreview();
}

function addOption(fieldIdx) {
    fields[fieldIdx].options.push('');
    renderFields();
}
function removeOption(fieldIdx, optIdx) {
    fields[fieldIdx].options.splice(optIdx, 1);
    renderFields();
}
function updateOption(fieldIdx, optIdx, value) {
    fields[fieldIdx].options[optIdx] = value;
}

// ============================
// VISTA PREVIA EN VIVO
// ============================
function updatePreview() {
    const preview = document.getElementById('livePreview');
    const formName = document.getElementById('formName').value || 'Formulario sin título';
    const formType = document.getElementById('formType').value;
    const allowEdit = document.getElementById('formAllowEdit').value === 'true';

    let html = '';

    // Título
    html += `<h4 class="fw-bold mb-1" style="color: #ff8c00;">${formName}</h4>`;
    html += `<span class="badge ${formType === 'examen' ? 'bg-warning text-dark' : 'bg-info'} rounded-pill mb-3">${formType === 'examen' ? 'Examen' : 'Registro'}</span>`;

    if (!allowEdit) {
        html += `<div class="alert alert-warning py-1 small mb-3"><i class="bi bi-exclamation-triangle me-1"></i>Una vez enviada la respuesta <strong>no podrá modificarse</strong>.</div>`;
    }

    // Campos personales
    if (document.getElementById('trigNombre').checked) {
        html += `<div class="mb-3"><label class="form-label fw-semibold small">Nombre Completo <span class="text-danger">*</span></label><input type="text" class="form-control form-control-sm" disabled placeholder="Juan Pérez"></div>`;
    }
    if (document.getElementById('trigEmail').checked) {
        html += `<div class="mb-3"><label class="form-label fw-semibold small">Email</label><input type="email" class="form-control form-control-sm" disabled placeholder="correo@ejemplo.com"></div>`;
    }
    if (document.getElementById('trigEdad').checked) {
        html += `<div class="mb-3"><label class="form-label fw-semibold small">Edad</label><input type="number" class="form-control form-control-sm" disabled placeholder="25"></div>`;
    }
    if (document.getElementById('trigTelefono').checked) {
        html += `<div class="mb-3"><label class="form-label fw-semibold small">Teléfono</label><input type="tel" class="form-control form-control-sm" disabled placeholder="88881234"></div>`;
    }
    if (document.getElementById('trigFecha').checked) {
        html += `<div class="mb-3"><label class="form-label fw-semibold small">Fecha</label><input type="date" class="form-control form-control-sm" disabled></div>`;
    }

    if (fields.length > 0) html += '<hr class="my-3">';

    // Preguntas
    fields.forEach((f, i) => {
        const label = f.label || `Pregunta ${i+1}`;
        html += `<div class="mb-3"><label class="form-label fw-semibold small">${i+1}. ${label}</label>`;

        if (f.field_type === 'text') {
            html += `<input type="text" class="form-control form-control-sm" disabled placeholder="Respuesta corta...">`;
        } else if (f.field_type === 'textarea') {
            html += `<textarea class="form-control form-control-sm" rows="3" disabled placeholder="Respuesta larga..."></textarea>`;
        } else if (f.field_type === 'radio') {
            const opts = f.options.length ? f.options : ['Opción 1', 'Opción 2'];
            opts.forEach(o => {
                html += `<div class="form-check"><input class="form-check-input" type="radio" disabled><label class="form-check-label small">${o || 'Opción'}</label></div>`;
            });
        } else if (f.field_type === 'checkbox') {
            const opts = f.options.length ? f.options : ['Opción 1', 'Opción 2'];
            opts.forEach(o => {
                html += `<div class="form-check"><input class="form-check-input" type="checkbox" disabled><label class="form-check-label small">${o || 'Opción'}</label></div>`;
            });
        } else if (f.field_type === 'file') {
            html += `<input type="file" class="form-control form-control-sm" disabled>`;
        }
        html += '</div>';
    });

    // Botón enviar
    html += `<button class="btn w-100 rounded-pill mt-3 text-white fw-bold" style="background-color: #ff8c00;" disabled><i class="bi bi-send me-1"></i>Enviar Respuesta</button>`;

    preview.innerHTML = html;
}

// ============================
// VER RESPUESTAS
// ============================
let currentResponsesFormId = null;

async function viewResponses(formId) {
    currentResponsesFormId = formId;
    const res = await fetch(`/api/forms/${formId}/responses`);
    const data = await res.json();
    window._responsesData = data;
    document.getElementById('responsesTitle').textContent = `Respuestas (${data.responses.length})`;

    if (!data.responses.length) {
        document.getElementById('responsesTable').innerHTML = '<p class="text-muted text-center py-4">Sin respuestas aún.</p>';
    } else {
        const hasScore = data.responses.some(r => r.score !== null && r.score !== undefined);
        let headers = '<th style="width:32px">#</th><th>Nombre</th><th class="text-nowrap">Fecha</th>';
        if (hasScore) headers += '<th>Nota</th>';
        headers += '<th class="text-center">Acciones</th>';

        let rows = data.responses.map((r, i) => {
            let row = `<td class="text-muted small">${i+1}</td>
                <td>
                    <span class="text-primary fw-semibold" style="cursor:pointer;" onclick="viewResponseDetail(${i})" title="Ver detalle">${r.nombre_completo || '—'}</span>
                    ${r.email ? `<br><small class="text-muted">${r.email}</small>` : ''}
                </td>
                <td class="text-nowrap text-muted small">${r.submitted_at}</td>`;
            if (hasScore) {
                row += `<td><span class="badge rounded-pill ${r.score >= 70 ? 'bg-success' : 'bg-danger'}">${r.score !== null ? r.score + '%' : '—'}</span></td>`;
            }
            row += `<td>
                <div class="d-flex gap-1 justify-content-center">
                    <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(13,110,253,0.1);color:#0d6efd;border:1px solid rgba(13,110,253,0.2);" onclick="viewResponseDetail(${i})" title="Ver"><i class="bi bi-eye" style="font-size:0.75rem;"></i></button>
                    <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(255,140,0,0.1);color:#ff8c00;border:1px solid rgba(255,140,0,0.2);" onclick="editResponseAdmin(${i})" title="Editar"><i class="bi bi-pencil" style="font-size:0.75rem;"></i></button>
                    <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(220,53,69,0.08);color:#dc3545;border:1px solid rgba(220,53,69,0.15);" onclick="deleteResponse(${r.id})" title="Eliminar"><i class="bi bi-trash3" style="font-size:0.75rem;"></i></button>
                </div>
            </td>`;
            return `<tr>${row}</tr>`;
        }).join('');

        document.getElementById('responsesTable').innerHTML = `
            <table class="table table-sm table-hover align-middle">
                <thead class="table-light"><tr>${headers}</tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    document.getElementById('formsList').classList.add('d-none');
    document.getElementById('responsesViewer').classList.remove('d-none');
}

function viewResponseDetail(index) {
    const data = window._responsesData;
    const r = data.responses[index];
    let html = `<div class="mb-3 p-3 rounded-4" style="background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.2);">
        <div class="fw-bold fs-5">${r.nombre_completo || 'Sin nombre'}</div>
        <div class="text-muted small mt-1">${r.submitted_at}${r.email ? ' · ' + r.email : ''}${r.telefono ? ' · ' + r.telefono : ''}</div>
        ${r.score !== null && r.score !== undefined ? `<span class="badge rounded-pill mt-1 ${r.score>=70?'bg-success':'bg-danger'}">${r.score}%</span>` : ''}
    </div>`;
    data.fields.forEach(f => {
        let val = r.answers[String(f.id)];
        if (Array.isArray(val)) val = val.join(', ');
        val = (val !== undefined && val !== null && val !== '') ? val : '—';
        html += `<div class="mb-2 p-2 rounded-3" style="background:rgba(0,0,0,0.03);">
            <small class="text-muted fw-bold d-block">${f.label}</small>
            <div class="mt-1">${val}</div>
        </div>`;
    });
    document.getElementById('responseDetailBody').innerHTML = html;
    document.getElementById('responseDetailName').textContent = r.nombre_completo || 'Detalle';
    new bootstrap.Modal(document.getElementById('responseDetailModal')).show();
}

function editResponseAdmin(index) {
    const data = window._responsesData;
    const r = data.responses[index];
    window._editingResponse = { id: r.id, formId: currentResponsesFormId };
    let html = `<div class="row g-2 mb-3">
        <div class="col-12"><label class="fw-semibold small text-muted">Nombre completo</label>
            <input type="text" class="form-control form-control-sm" id="erNombre" value="${r.nombre_completo || ''}"></div>
        <div class="col-6"><label class="fw-semibold small text-muted">Email</label>
            <input type="email" class="form-control form-control-sm" id="erEmail" value="${r.email || ''}"></div>
        <div class="col-6"><label class="fw-semibold small text-muted">Teléfono</label>
            <input type="tel" class="form-control form-control-sm" id="erTelefono" value="${r.telefono || ''}"></div>
    </div><hr class="my-2">`;
    data.fields.forEach(f => {
        let val = r.answers[String(f.id)];
        if (Array.isArray(val)) val = val.join(', ');
        val = val || '';
        html += `<div class="mb-2">
            <label class="fw-semibold small text-muted">${f.label}</label>
            <input type="text" class="form-control form-control-sm" data-field-id="${f.id}" value="${String(val).replace(/"/g, '&quot;')}">
        </div>`;
    });
    document.getElementById('editResponseBody').innerHTML = html;
    new bootstrap.Modal(document.getElementById('editResponseModal')).show();
}

async function saveEditedResponse() {
    const ctx = window._editingResponse;
    if (!ctx) return;
    const answers = {};
    document.querySelectorAll('#editResponseBody [data-field-id]').forEach(input => {
        answers[input.dataset.fieldId] = input.value;
    });
    const res = await fetch(`/api/forms/admin/responses/${ctx.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            nombre_completo: document.getElementById('erNombre').value,
            email: document.getElementById('erEmail').value,
            telefono: document.getElementById('erTelefono').value,
            answers
        })
    });
    const d = await res.json();
    if (d.ok) {
        bootstrap.Modal.getInstance(document.getElementById('editResponseModal')).hide();
        viewResponses(ctx.formId);
    } else { alert(d.error || 'Error al guardar'); }
}

async function deleteResponse(responseId) {
    if (!confirm('¿Eliminar esta respuesta del formulario?')) return;
    const res = await fetch(`/api/forms/responses/${responseId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.ok) {
        viewResponses(currentResponsesFormId);
    } else {
        alert(data.error || 'Error al eliminar');
    }
}

async function exportResponses(fmt) {
    if (!currentResponsesFormId) return;
    if (fmt === 'whatsapp') {
        const res = await fetch(`/api/forms/${currentResponsesFormId}/export/whatsapp`);
        const data = await res.json();
        if (data.text) {
            navigator.clipboard.writeText(data.text).then(() => alert('📋 Texto copiado al portapapeles. Pégalo en WhatsApp.'));
        }
    } else {
        window.open(`/api/forms/${currentResponsesFormId}/export/${fmt}`, '_blank');
    }
}

// Init
loadForms();
</script>
