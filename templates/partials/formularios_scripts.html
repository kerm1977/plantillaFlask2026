{% include 'partials/formularios_list_scripts.html' %}
{% include 'partials/formularios_builder_scripts.html' %}

<script>
let currentResponsesFormId = null;

async function viewResponses(formId) {
    currentResponsesFormId = formId;
    const data = await (await fetch(`/api/forms/${formId}/responses`)).json();
    window._responsesData = data;
    document.getElementById('responsesTitle').textContent = `Respuestas (${data.responses.length})`;
    if (!data.responses.length) {
        document.getElementById('responsesTable').innerHTML = '<p class="text-muted text-center py-4">Sin respuestas aun.</p>';
    } else {
        const hasScore = data.responses.some(r => r.score !== null && r.score !== undefined);
        let headers = '<th style="width:32px">#</th><th>Nombre</th>';
        if (hasScore) headers += '<th>Nota</th>';
        headers += '<th class="text-center">Acciones</th>';
        let rows = data.responses.map((r, i) => {
            let row = `<td class="text-muted small">${i+1}</td>
                <td><span class="text-primary fw-semibold" style="cursor:pointer;" onclick="viewResponseDetail(${i})">${r.nombre_completo || 'Sin nombre'}</span>
                ${r.email ? `<br><small class="text-muted">${r.email}</small>` : ''}</td>`;
            if (hasScore) row += `<td><span class="badge rounded-pill ${r.score>=70?'bg-success':'bg-danger'}">${r.score !== null ? r.score+'%' : '-'}</span></td>`;
            row += `<td><div class="d-flex gap-1 justify-content-center">
                <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(13,110,253,0.1);color:#0d6efd;border:1px solid rgba(13,110,253,0.2);" onclick="viewResponseDetail(${i})"><i class="bi bi-eye" style="font-size:0.75rem;"></i></button>
                <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(255,140,0,0.1);color:#ff8c00;border:1px solid rgba(255,140,0,0.2);" onclick="editResponseAdmin(${i})"><i class="bi bi-pencil" style="font-size:0.75rem;"></i></button>
                <button class="btn btn-sm rounded-pill py-0 px-2" style="background:rgba(220,53,69,0.08);color:#dc3545;border:1px solid rgba(220,53,69,0.15);" onclick="deleteResponse(${r.id})"><i class="bi bi-trash3" style="font-size:0.75rem;"></i></button>
            </div></td>`;
            return `<tr>${row}</tr>`;
        }).join('');
        document.getElementById('responsesTable').innerHTML = `
            <table class="table table-sm table-hover align-middle">
                <thead class="table-light"><tr>${headers}</tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }
    document.getElementById('formsList').classList.add('d-none');
    document.getElementById('responsesViewer').classList.remove('d-none');
}

function viewResponseDetail(index) {
    const data = window._responsesData, r = data.responses[index];
    let html = `<div class="mb-3 p-3 rounded-4" style="background:rgba(255,140,0,0.08);border:1px solid rgba(255,140,0,0.2);">
        <div class="fw-bold fs-5">${r.nombre_completo || 'Sin nombre'}</div>
        <div class="text-muted small mt-1">${r.submitted_at}${r.email?' • '+r.email:''}${r.telefono?' • '+r.telefono:''}</div>
        ${r.score !== null && r.score !== undefined ? `<span class="badge rounded-pill mt-1 ${r.score>=70?'bg-success':'bg-danger'}">${r.score}%</span>` : ''}</div>`;
    data.fields.forEach(f => {
        let val = r.answers[String(f.id)];
        if (Array.isArray(val)) val = val.join(', ');
        val = (val !== undefined && val !== null && val !== '') ? val : '-';
        html += `<div class="mb-2 p-2 rounded-3" style="background:rgba(0,0,0,0.03);">
            <small class="text-muted fw-bold d-block">${f.label}</small>
            <div class="mt-1">${val}</div></div>`;
    });
    document.getElementById('responseDetailBody').innerHTML = html;
    document.getElementById('responseDetailName').textContent = r.nombre_completo || 'Detalle';
    const rdModal = document.getElementById('responseDetailModal');
    if (rdModal.parentElement !== document.body) document.body.appendChild(rdModal);
    new bootstrap.Modal(rdModal).show();
}

function editResponseAdmin(index) {
    const data = window._responsesData, r = data.responses[index];
    window._editingResponse = {id: r.id, formId: currentResponsesFormId};
    let html = `<div class="row g-2 mb-3">
        <div class="col-12"><label class="fw-semibold small text-muted">Nombre completo</label>
            <input type="text" class="form-control form-control-sm" id="erNombre" value="${r.nombre_completo || ''}"></div>
        <div class="col-6"><label class="fw-semibold small text-muted">Email</label>
            <input type="email" class="form-control form-control-sm" id="erEmail" value="${r.email || ''}"></div>
        <div class="col-6"><label class="fw-semibold small text-muted">Telefono</label>
            <input type="tel" class="form-control form-control-sm" id="erTelefono" value="${r.telefono || ''}"></div>
    </div><hr class="my-2">`;
    data.fields.forEach(f => {
        const rawVal = r.answers[String(f.id)];
        let fieldHtml = '';
        if (f.field_type === 'radio' && f.options && f.options.length) {
            const currentVal = Array.isArray(rawVal) ? rawVal[0] : (rawVal || '');
            fieldHtml = f.options.map(o => `<div class="form-check"><input class="form-check-input" type="radio" name="field_er_${f.id}" data-field-id="${f.id}" value="${o}" ${currentVal===o?'checked':''}><label class="form-check-label small">${o}</label></div>`).join('');
        } else if (f.field_type === 'checkbox' && f.options && f.options.length) {
            const currentVals = Array.isArray(rawVal) ? rawVal : (rawVal ? [rawVal] : []);
            fieldHtml = f.options.map(o => `<div class="form-check"><input class="form-check-input" type="checkbox" name="field_er_${f.id}" data-field-id="${f.id}" value="${o}" ${currentVals.includes(o)?'checked':''}><label class="form-check-label small">${o}</label></div>`).join('');
        } else {
            const textVal = Array.isArray(rawVal) ? rawVal.join(', ') : (rawVal || '');
            fieldHtml = `<input type="text" class="form-control form-control-sm" data-field-id="${f.id}" value="${String(textVal).replace(/"/g,'&quot;')}">`;
        }
        html += `<div class="mb-3 p-2 rounded-3" style="background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.06);">
            <label class="fw-semibold small text-muted d-block mb-1">${f.label}</label>${fieldHtml}</div>`;
    });
    document.getElementById('editResponseBody').innerHTML = html;
    const erModal = document.getElementById('editResponseModal');
    if (erModal.parentElement !== document.body) document.body.appendChild(erModal);
    new bootstrap.Modal(erModal).show();
}

async function saveEditedResponse() {
    const ctx = window._editingResponse; if (!ctx) return;
    const answers = {}, fieldIds = new Set();
    document.querySelectorAll('#editResponseBody [data-field-id]').forEach(el => fieldIds.add(el.dataset.fieldId));
    fieldIds.forEach(fid => {
        const inputs = document.querySelectorAll(`#editResponseBody [data-field-id="${fid}"]`);
        if (!inputs.length) return;
        const t = inputs[0].type;
        if (t === 'radio') { const ch = document.querySelector(`#editResponseBody [data-field-id="${fid}"]:checked`); answers[fid] = ch ? ch.value : ''; }
        else if (t === 'checkbox') { answers[fid] = Array.from(document.querySelectorAll(`#editResponseBody [data-field-id="${fid}"]:checked`)).map(c=>c.value); }
        else { answers[fid] = inputs[0].value; }
    });
    const res = await fetch(`/api/forms/admin/responses/${ctx.id}`, {
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({nombre_completo: document.getElementById('erNombre').value, email: document.getElementById('erEmail').value, telefono: document.getElementById('erTelefono').value, answers})
    });
    const d = await res.json();
    if (d.ok) { bootstrap.Modal.getInstance(document.getElementById('editResponseModal')).hide(); viewResponses(ctx.formId); }
    else { alert(d.error || 'Error al guardar'); }
}

async function deleteResponse(responseId) {
    if (!confirm('Eliminar esta respuesta?')) return;
    const data = await (await fetch(`/api/forms/responses/${responseId}`, {method:'DELETE'})).json();
    if (data.ok) { viewResponses(currentResponsesFormId); }
    else { alert(data.error || 'Error al eliminar'); }
}

async function exportResponses(fmt) {
    if (!currentResponsesFormId) return;
    if (fmt === 'whatsapp') {
        const data = await (await fetch(`/api/forms/${currentResponsesFormId}/export/whatsapp`)).json();
        if (data.text) navigator.clipboard.writeText(data.text).then(() => alert('Texto copiado. Pegalo en WhatsApp.'));
    } else {
        window.open(`/api/forms/${currentResponsesFormId}/export/${fmt}`, '_blank');
    }
}

loadForms();
</script>
