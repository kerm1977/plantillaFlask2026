                  <!-- Formas de Pago -->
                  <div class="accordion-item glass-table-container border-0 mb-2 rounded-4 overflow-hidden no-cotizacion">
                    <h2 class="accordion-header">
                      <button class="accordion-button collapsed fw-bold text-warning-custom" type="button" data-bs-toggle="collapse" data-bs-target="#accFormasPago">
                        <i class="bi bi-credit-card me-2"></i>Formas de Pago
                      </button>
                    </h2>
                    <div id="accFormasPago" class="accordion-collapse collapse" data-bs-parent="#infoCaminataAccordion">
                      <div class="accordion-body">
                        <div class="d-flex justify-content-end mb-3">
                          <button type="button" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" onclick="exportarFormasPagoWhatsApp()">
                            <i class="bi bi-whatsapp me-2"></i>Exportar a WhatsApp
                          </button>
                        </div>

                        <div class="glass-panel p-3 rounded-4 border-0 shadow-sm mb-3" style="background: rgba(255,255,255,0.45);">
                          <h6 class="fw-bold text-dark mb-3"><i class="bi bi-info-circle text-orange me-2"></i>Todas las formas de pago registradas</h6>
                          <div class="row g-3">
                            <div class="col-12 col-md-6">
                              <p class="mb-2 small fw-bold text-muted">SINPE:</p>
                              <ul id="listaSinpes" class="list-unstyled small mb-0">
                                {% for m in sinpe_methods %}
                                <li class="mb-1">{{ m.display() }}</li>
                                {% endfor %}
                              </ul>
                            </div>
                            <div class="col-12 col-md-6">
                              <p class="mb-2 small fw-bold text-muted">Cuentas:</p>
                              <ul id="listaCuentas" class="list-unstyled small mb-0">
                                {% for m in cuenta_methods %}
                                <li class="mb-1 text-break">{{ m.display() }}</li>
                                {% endfor %}
                              </ul>
                            </div>
                          </div>
                        </div>

                        <div class="row g-3 mb-3">
                          <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small mb-1">SINPE a usar</label>
                            <select id="sinpe" name="sinpe" class="form-select glass-input rounded-3">
                              {% for m in sinpe_methods %}
                              <option value="{{ m.display() }}">{{ m.display() }}</option>
                              {% endfor %}
                            </select>
                          </div>
                          <div class="col-12 col-md-6">
                            <label class="form-label fw-bold text-muted small mb-1">Cuenta a usar</label>
                            <select id="cuenta" name="cuenta" class="form-select glass-input rounded-3">
                              <option value="Ninguna">-- Ninguna / Solo usar SINPE --</option>
                              {% for m in cuenta_methods %}
                              <option value="{{ m.display() }}">{{ m.display() }}</option>
                              {% endfor %}
                            </select>
                          </div>
                        </div>

                        <div class="glass-panel p-3 rounded-4 border-0 shadow-sm" style="background: rgba(255,255,255,0.35);">
                          <h6 class="fw-bold text-dark mb-3"><i class="bi bi-plus-circle text-orange me-2"></i>Agregar nueva forma de pago</h6>
                          <div class="row g-3 mb-3">
                            <div class="col-12 col-md-5">
                              <input type="text" id="nuevoSinpeNumero" class="form-control glass-input rounded-3" placeholder="Número SINPE" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                            </div>
                            <div class="col-12 col-md-5">
                              <input type="text" id="nuevoSinpeTitular" class="form-control glass-input rounded-3" placeholder="Nombre del titular">
                            </div>
                            <div class="col-12 col-md-2 d-grid">
                              <button type="button" class="btn btn-warning fw-bold text-dark rounded-3" onclick="agregarFormaPago('sinpe')">Agregar SINPE</button>
                            </div>
                          </div>
                          <div class="row g-3">
                            <div class="col-12 col-md-4">
                              <input type="text" id="nuevaCuentaNumero" class="form-control glass-input rounded-3" placeholder="Número de cuenta / IBAN">
                            </div>
                            <div class="col-12 col-md-3">
                              <input type="text" id="nuevaCuentaTitular" class="form-control glass-input rounded-3" placeholder="Titular">
                            </div>
                            <div class="col-12 col-md-3">
                              <input type="text" id="nuevaCuentaDetalle" class="form-control glass-input rounded-3" placeholder="Banco / Moneda">
                            </div>
                            <div class="col-12 col-md-2 d-grid">
                              <button type="button" class="btn btn-warning fw-bold text-dark rounded-3" onclick="agregarFormaPago('cuenta')">Agregar Cuenta</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
