============================================================== -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    {% if is_super_user %}
    const btnExportFlyer = document.getElementById('btnExportFlyer');
    if (btnExportFlyer) {
        btnExportFlyer.addEventListener('click', async function() {
            if (typeof htmlToImage === 'undefined') {
                alert("La librería de exportación no se ha cargado. Verifica tu conexión a internet.");
                return;
            }
            const captureArea = document.getElementById('flyerCaptureArea');
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Generando Alta Resolución...';
            this.disabled = true;
            try {
                const currentTransform = captureArea.style.transform;
                captureArea.style.transform = 'none';
                const dataUrl = await htmlToImage.toPng(captureArea, { 
                    pixelRatio: 4,
                    backgroundColor: 'transparent',
                    style: { transform: 'none' } 
                });
                captureArea.style.transform = currentTransform;
                const link = document.createElement('a');
                const safeName = "{{ evento.nombre_lugar }}".replace(/[^a-zA-Z0-9\s]/g, '').replace(/\s+/g, '_');
                link.download = `Flyer_${safeName}.png`;
                link.href = dataUrl;
                link.click();
            } catch(e) {
                console.error(e);
                alert("Error al generar el flyer. Intenta de nuevo.");
            } finally {
                this.innerHTML = originalText;
                this.disabled = false;
            }
        });
    }

    // BLINDADO: hora de salida editable desde el generador de flyer.
    // Guarda en BD y refleja el cambio en el flyer y en la tarjeta de detalle.
    const flyerHoraInput = document.getElementById('flyerHoraSalida');
    if (flyerHoraInput) {
        flyerHoraInput.addEventListener('change', async function() {
            const v = this.value;
            const msg = document.getElementById('flyerHoraMsg');
            try {
                const res = await fetch('/api/eventos/{{ evento.id }}/hora', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hora: v })
                });
                if (!res.ok) throw new Error();
                const dest = document.getElementById('fl_salida')?.dataset.dest || '';
                const flTxt = document.getElementById('flSalidaTexto');
                if (flTxt) flTxt.innerText = dest + ' (' + (v || 'Por definir') + ')';
                const cardTxt = document.getElementById('horaSalidaCardText');
                if (cardTxt) cardTxt.innerText = v || 'Por definir';
                if (msg) { msg.innerText = 'Guardada'; setTimeout(() => msg.innerText = '', 2500); }
            } catch(e) {
                if (msg) msg.innerText = 'Error al guardar';
            }
        });
    }

    // BLINDADO: fondo propio del flyer — sube imagen o vuelve al póster del evento.
    const flyerBgFile = document.getElementById('flyerBgFile');
    const flyerBgReset = document.getElementById('flyerBgReset');
    function setFlyerBgSrc(url) {
        const img = document.getElementById('flyerBgImg');
        const clone = document.getElementById('flyerBgImgClone');
        if (img) img.src = url;
        if (clone) clone.src = url;
    }
    async function postFlyerBg(fd) {
        try {
            const res = await fetch(flyerBgFile.dataset.url, { method: 'POST', body: fd });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Error');
            setFlyerBgSrc(data.url || flyerBgFile.dataset.poster);
        } catch(e) {
            alert(e.message || 'Error al guardar el fondo');
        }
    }
    if (flyerBgFile) {
        flyerBgFile.addEventListener('change', function() {
            if (!this.files || !this.files[0]) return;
            const fd = new FormData();
            fd.append('fondo', this.files[0]);
            postFlyerBg(fd);
            this.value = '';
        });
    }
    if (flyerBgReset) {
        flyerBgReset.addEventListener('click', function() {
            const fd = new FormData();
            postFlyerBg(fd);
            flyerBgReset.remove();
        });
    }
    {% endif %}
});
</script>
