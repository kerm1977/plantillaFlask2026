<div class="modal fade" id="cotizadorBusModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-shield-lock-fill text-orange me-2"></i>Acceso al Cotizador</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4 text-center">
                <img src="{{ url_for('static', filename='uploads/icon-192.png') }}" alt="TRANSAVI" style="width:80px;height:80px;border-radius:50%;object-fit:cover;" class="mb-3 shadow">
                <div class="mb-3 text-start">
                    <label class="form-label fw-semibold">Clave de Acceso</label>
                    <div class="position-relative">
                        <input type="password" class="form-control glass-input rounded-4 form-control-lg pe-5" id="claveCotizadorBus" placeholder="Ingresa la clave">
                        <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 fs-5" style="cursor:pointer; color:#6c757d;" id="toggleClaveCotizadorBus" onclick="toggleClaveCotizadorBusVisibilidad()"></i>
                    </div>
                    <div class="small text-muted mt-2 text-uppercase text-center fw-bold">ESTE ESPACIO ESTÁ RESERVADO ÚNICAMENTE PARA TRANSAVI</div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4">
                <button onclick="ingresarCotizadorBus()" class="btn btn-orange rounded-pill w-100 py-2 fw-bold btn-lg">Acceder</button>
            </div>
        </div>
    </div>
</div>
