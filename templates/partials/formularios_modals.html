<!-- MODAL: VER DETALLE DE RESPUESTA -->
<div class="modal fade" id="responseDetailModal" tabindex="-1" style="z-index:1060;">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-modal shadow-lg border-0">
            <div class="modal-header border-bottom-0 pb-0 pt-4 px-4 px-md-5">
                <h4 class="modal-title fw-bold text-dark w-100 text-center" id="responseDetailName">Detalle de Respuesta</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 px-md-5 pb-5 pt-3" id="responseDetailBody"></div>
        </div>
    </div>
</div>

<!-- MODAL: EDITAR RESPUESTA (Superusuario) -->
<div class="modal fade" id="editResponseModal" tabindex="-1" style="z-index:1060;">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 rounded-5 glass-panel">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-pencil-fill text-orange me-2"></i>Editar Respuesta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4" id="editResponseBody"></div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
                <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-orange rounded-pill px-5 py-2 fw-bold" onclick="saveEditedResponse()">
                    <i class="bi bi-check2 me-1"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: COMPARTIR ENLACE -->
<div class="modal fade" id="shareLinkModal" tabindex="-1" style="z-index:1060;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1.5rem;">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-share-fill text-orange me-2"></i>Compartir Formulario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4">
                <p class="text-secondary mb-3">Copia este enlace para compartir el formulario:</p>
                <div class="input-group mb-3 shadow-sm" style="border-radius: 1rem; overflow: hidden;">
                    <span class="input-group-text bg-white border-end-0 text-orange"><i class="bi bi-link-45deg fs-4"></i></span>
                    <input type="text" id="shareLinkInput" class="form-control border-start-0 bg-white text-dark fw-bold" readonly
                           style="cursor:pointer;" onclick="copyShareLink()" title="Toca para copiar">
                    <span class="input-group-text bg-white border-start-0" style="cursor:pointer;" onclick="copyShareLink()">
                        <i class="bi bi-copy text-orange"></i>
                    </span>
                </div>
                <div id="shareCopyFeedback" class="text-success fw-bold small mb-3 d-none">
                    <i class="bi bi-check-circle-fill me-1"></i>¡Enlace copiado!
                </div>
                <button class="btn btn-success fw-bold w-100 py-3 shadow rounded-pill text-uppercase" onclick="copyShareLink()">
                    <i class="bi bi-whatsapp me-2 fs-5"></i> Copiar para WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: NÚMEROS DE RESERVA -->
<div class="modal fade" id="reservationModal" tabindex="-1" style="z-index:1060;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1.5rem;">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 id="reservationModalLabel" class="modal-title fw-bold fs-5"><i class="bi bi-list-check text-warning me-2"></i>Números de Reserva</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4">
                <p class="text-secondary mb-3">Ingresa los números de reserva que aparecerán en las exportaciones:</p>
                <textarea id="reservationNumbersInput" class="form-control rounded-3" rows="6" 
                          placeholder="Ejemplo:&#10;RES-001&#10;RES-002&#10;RES-003&#10;&#10;O separados por comas: RES-001, RES-002, RES-003"></textarea>
                <div class="mt-3">
                    <button class="btn btn-outline-warning btn-sm rounded-pill" onclick="clearReservationNumbers()">
                        <i class="bi bi-trash me-1"></i>Limpiar
                    </button>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4">
                <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-warning rounded-pill px-5 py-2 fw-bold" onclick="saveReservationNumbers()">
                    <i class="bi bi-check2 me-1"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>
