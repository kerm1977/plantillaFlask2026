<div class="modal fade" id="holidayModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-modal border-0 shadow-lg">
      <div class="modal-header border-0 pb-0 justify-content-center flex-column text-center">
        <div id="modal-preview" style="font-size:2.5rem;"></div>
        <h5 class="modal-title fw-bold text-dark mt-1" id="modal-nombre"></h5>
        <p class="text-secondary small mb-0" id="modal-fecha"></p>
      </div>
      <div class="modal-body pt-3 pb-2">
        <input type="hidden" id="modal-id">
        <input type="hidden" id="modal-custom">
        <div class="mb-3">
          <label for="modal-titulo" class="form-label fw-semibold small">Título del mensaje</label>
          <input type="text" class="form-control" id="modal-titulo">
        </div>
        <div class="mb-3">
          <label for="modal-subtitulo" class="form-label fw-semibold small">Mensaje de felicitación</label>
          <textarea class="form-control" id="modal-subtitulo" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label for="modal-icono" class="form-label fw-semibold small">Ícono (emoji o clase bi-*)</label>
          <div class="input-group">
            <input type="text" class="form-control" id="modal-icono" placeholder="🎉 o bi bi-balloon">
            {% set icono_preset_id = 'modal-icono-preset' %}{% include 'partials/icono_preset_select.html' %}
          </div>
        </div>
        <div id="modal-fecha-grupo" class="row d-none">
          <div class="col-6 mb-3">
            <label for="modal-mes" class="form-label fw-semibold small">Mes inicio</label>
            <select class="form-select" id="modal-mes">
              {% for i in range(1, 13) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-6 mb-3">
            <label for="modal-dia" class="form-label fw-semibold small">Día inicio</label>
            <select class="form-select" id="modal-dia">
              {% for i in range(1, 32) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-6 mb-3">
            <label for="modal-fin-mes" class="form-label fw-semibold small">Mes fin</label>
            <select class="form-select" id="modal-fin-mes">
              <option value="">Sin fecha final</option>
              {% for i in range(1, 13) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-6 mb-3">
            <label for="modal-fin-dia" class="form-label fw-semibold small">Día fin</label>
            <select class="form-select" id="modal-fin-dia">
              <option value="">Sin fecha final</option>
              {% for i in range(1, 32) %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
            </select>
          </div>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-activo">
          <label class="form-check-label ms-2 fw-semibold" for="modal-activo">Activar trigger</label>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-autoplay">
          <label class="form-check-label ms-2 fw-semibold" for="modal-autoplay">Reproducir canción automáticamente</label>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-confeti" checked>
          <label class="form-check-label ms-2 fw-semibold" for="modal-confeti">Mostrar confeti</label>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-reproductor" checked>
          <label class="form-check-label ms-2 fw-semibold" for="modal-reproductor">Mostrar reproductor de música</label>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-superuser">
          <label class="form-check-label ms-2 fw-semibold" for="modal-superuser">Solo superusuarios o administradores</label>
        </div>
        <div class="form-check form-switch d-flex justify-content-start align-items-center mb-2">
          <input class="form-check-input" type="checkbox" id="modal-link-activo">
          <label class="form-check-label ms-2 fw-semibold" for="modal-link-activo">Activar enlace</label>
        </div>
        <div class="mb-3">
          <label for="modal-link" class="form-label fw-semibold small">URL del enlace</label>
          <input type="url" class="form-control" id="modal-link" placeholder="https://...">
        </div>
        <div class="mb-3">
          <label for="modal-mensaje" class="form-label fw-semibold small">Mensaje personalizado</label>
          <textarea class="form-control" id="modal-mensaje" rows="2" placeholder="Dejar en blanco para usar el mensaje predeterminado"></textarea>
        </div>
        <div class="mb-3">
          <label for="modal-cancion" class="form-label fw-semibold small">Canción del modal</label>
          <select class="form-select" id="modal-cancion">
            <option value="">Sin música</option>
            {% for c in canciones %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label for="modal-cancion-file" class="form-label fw-semibold small">O subir una nueva canción</label>
          <input class="form-control" type="file" id="modal-cancion-file" accept=".mp3,.wav,.ogg,.m4a,audio/*">
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 flex-column gap-2">
        <button type="button" class="btn btn-orange rounded-pill w-100 fw-bold" onclick="guardarFeriado()">Guardar cambios</button>
        <button type="button" class="btn btn-outline-secondary rounded-pill w-100" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
