<!-- ==============================================================
     BLINDADO - NO MODIFICAR SIN PERMISO EXPLICITO DEL DUENO
     Modal: compartir enlace QR de caminata por WhatsApp (superusuario)
============================================================== -->
<div class="modal fade" id="qrShareModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold"><i class="bi bi-qr-code me-2 text-orange"></i>Compartir QR de caminata</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-0">
                <p class="small text-muted mb-2" id="qrShareEventName"></p>
                <textarea id="qrShareMsg" class="form-control rounded-3 mb-2" rows="4"
                          placeholder="Escribí un mensaje..."></textarea>
                <input type="text" id="qrShareLink" class="form-control rounded-pill small text-muted mb-3" readonly>
                <a href="#" id="qrShareSend" target="_blank" rel="noopener"
                   class="btn btn-success rounded-pill fw-bold w-100">
                    <i class="bi bi-whatsapp me-1"></i>Enviar por WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>
