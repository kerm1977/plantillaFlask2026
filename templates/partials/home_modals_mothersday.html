{% if mothers_day %}
<!-- MODAL DÍA DE LA MADRE -->
<div class="modal fade" id="mothersDayModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            <div class="modal-header border-0 pb-0 justify-content-center flex-column text-center">
                <div style="font-size:3rem;">🌷</div>
                <h4 class="fw-bold text-dark mt-1 mb-0">¡Feliz Día de las Madres!</h4>
                <p class="text-secondary small mb-0">A todas las madres de Costa Rica, con cariño de La Tribu de Los Libres</p>
            </div>
            <div class="modal-body pt-3 pb-2">
                <div class="rounded-4 p-3 text-center mb-2"
                     style="background:rgba(255,105,180,0.12);border:1px solid rgba(255,105,180,0.4);">
                    <p class="fw-semibold text-dark mb-0">🎉 ¡Feliz Día de las Madres! 🎉</p>
                    <p class="small text-secondary mb-0">Te lo desea La Tribu de Los Libres</p>
                </div>
                <audio id="mothersDayAudio" controls style="width:100%;"
                       src="{{ url_for('static', filename='musica/DIA DE LA MADRE.mp3') }}">
                    Tu navegador no soporta el reproductor de audio.
                </audio>
            </div>
            <div class="modal-footer border-0 pt-0 flex-column gap-2">
                <button type="button" class="btn btn-warning-orange rounded-pill w-100 fw-bold" onclick="dismissMothersDayForever()">
                    No volver a mostrar más
                </button>
                <button type="button" class="btn btn-orange rounded-pill w-100 fw-bold" onclick="closeMothersDayModal()">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- BOTÓN DE SONIDO FIJO A UN COSTADO -->
<button id="mothersDayStopBtn" type="button" class="btn btn-sm btn-dark position-fixed"
        style="top:1rem; left:1rem; z-index:1060; opacity:0.85; display:none;"
        onclick="stopMothersDayAudio()" aria-label="Detener sonido">
    🔇 Detener sonido
</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script>
(function() {
    const MDay_KEY = 'mothersDayDismissed';
    const MDay_FOREVER_KEY = 'mothersDayDismissedForever';
    const today = new Date().toISOString().slice(0, 10);
    const audio = document.getElementById('mothersDayAudio');
    const stopBtn = document.getElementById('mothersDayStopBtn');

    function launchConfetti() {
        const end = Date.now() + 2500;
        (function frame() {
            confetti({ particleCount: 6, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff69b4','#ff4081','#ffc107','#00bcd4','#4caf50'], zIndex: 9999 });
            confetti({ particleCount: 6, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff69b4','#ff4081','#ffc107','#00bcd4','#4caf50'], zIndex: 9999 });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    window.stopMothersDayAudio = function() {
        if (audio) {
            audio.pause();
            audio.currentTime = 0;
        }
    };

    window.dismissMothersDayForever = function() {
        localStorage.setItem(MDay_FOREVER_KEY, '1');
        bootstrap.Modal.getInstance(document.getElementById('mothersDayModal')).hide();
    };

    window.closeMothersDayModal = function() {
        bootstrap.Modal.getInstance(document.getElementById('mothersDayModal')).hide();
    };

    document.addEventListener('DOMContentLoaded', function() {
        if (localStorage.getItem(MDay_FOREVER_KEY) === '1' || localStorage.getItem(MDay_KEY) === today) return;
        setTimeout(function() {
            const modal = new bootstrap.Modal(document.getElementById('mothersDayModal'));
            const modalEl = document.getElementById('mothersDayModal');
            modalEl.addEventListener('shown.bs.modal', function() {
                if (stopBtn) stopBtn.style.display = 'block';
                launchConfetti();
                if (audio) {
                    audio.play().catch(function(e) { console.log('Autoplay bloqueado:', e); });
                }
            }, { once: true });
            modalEl.addEventListener('hidden.bs.modal', function() {
                window.stopMothersDayAudio();
                if (stopBtn) stopBtn.style.display = 'none';
            }, { once: true });
            modal.show();
        }, 1200);
    });
})();
</script>
{% endif %}
