<!-- MODAL DE NOTAS ADMINISTRATIVAS -->
<div class="modal fade" id="notesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="bi bi-journal-text text-orange me-2"></i>Notas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- LISTA DE NOTAS -->
                <div id="notesListContainer" class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-dark mb-0">Mis Notas</h6>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="exportNotesJSON()">
                                <i class="bi bi-download me-1"></i>JSON
                            </button>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="importNotesJSON()">
                                <i class="bi bi-upload me-1"></i>Importar
                            </button>
                        </div>
                    </div>
                    <div id="notesList" class="row g-2">
                        <div class="col-12 text-center py-4 text-muted">
                            <i class="bi bi-journal fs-1 mb-2 d-block"></i>
                            Cargando notas...
                        </div>
                    </div>
                </div>

                <!-- EDITOR DE NOTA -->
                <div id="noteEditorContainer" class="d-none">
                    <div class="mb-3">
                        <input type="text" id="noteTitleInput" class="form-control form-control-lg rounded-pill border-0 bg-white bg-opacity-75" placeholder="Título de la nota">
                    </div>
                    
                    <!-- BARRA DE HERRAMIENTAS WYSIWYG -->
                    <div class="d-flex flex-wrap gap-1 mb-2 p-2 bg-white bg-opacity-50 rounded-3">
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('bold')" title="Negrita"><i class="bi bi-type-bold"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('italic')" title="Itálica"><i class="bi bi-type-italic"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('underline')" title="Subrayado"><i class="bi bi-type-underline"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('strikeThrough')" title="Tachado"><i class="bi bi-type-strikethrough"></i></button>
                        <div class="vr mx-1"></div>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('justifyLeft')" title="Izquierda"><i class="bi bi-text-left"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('justifyCenter')" title="Centro"><i class="bi bi-text-center"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('justifyRight')" title="Derecha"><i class="bi bi-text-right"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('justifyFull')" title="Justificado"><i class="bi bi-justify"></i></button>
                        <div class="vr mx-1"></div>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('insertUnorderedList')" title="Viñetas"><i class="bi bi-list-ul"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="execCmd('insertOrderedList')" title="Numeración"><i class="bi bi-list-ol"></i></button>
                        <div class="vr mx-1"></div>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="insertCheckbox()" title="To-do"><i class="bi bi-check-square"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="insertLink()" title="Enlace"><i class="bi bi-link-45deg"></i></button>
                        <button class="btn btn-sm btn-light rounded-circle" onclick="insertImage()" title="Imagen"><i class="bi bi-image"></i></button>
                    </div>

                    <!-- ÁREA DE EDICIÓN -->
                    <div id="noteContentEditor" contenteditable="true" class="form-control bg-white bg-opacity-75 border-0 rounded-3 p-3" style="min-height: 200px; max-height: 400px; overflow-y: auto;"></div>

                    <!-- BARRA DE PROGRESO DE TAREAS -->
                    <div id="noteProgressContainer" class="mt-2 d-none">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Progreso</span>
                            <span id="noteProgressText">0%</span>
                        </div>
                        <div class="progress rounded-pill" style="height: 8px;">
                            <div id="noteProgressBar" class="progress-bar bg-orange" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>

                    <!-- BOTONES DE ACCIÓN DE NOTA -->
                    <div class="d-flex flex-wrap gap-2 mt-3">
                        <button class="btn btn-success rounded-pill px-4 flex-grow-1" onclick="saveNote()">
                            <i class="bi bi-check-lg me-1"></i>Guardar
                        </button>
                        <button class="btn btn-outline-secondary rounded-pill px-3" onclick="cancelEdit()">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </button>
                        <div class="vr mx-1"></div>
                        <button class="btn btn-outline-primary rounded-pill px-3" onclick="exportNoteJPG()">
                            <i class="bi bi-image me-1"></i>JPG
                        </button>
                        <button class="btn btn-outline-info rounded-pill px-3" onclick="exportNotePNG()">
                            <i class="bi bi-file-earmark-image me-1"></i>PNG
                        </button>
                        <button class="btn btn-outline-success rounded-pill px-3" onclick="shareNoteWhatsApp()">
                            <i class="bi bi-whatsapp me-1"></i>WhatsApp
                        </button>
                    </div>
                </div>

                <!-- BOTÓN CREAR NUEVA -->
                <div id="createNoteBtnContainer" class="text-center mt-3">
                    <button class="btn btn-orange rounded-pill px-5 py-3 fw-bold shadow-sm" onclick="createNewNote()">
                        <i class="bi bi-plus-lg me-2"></i>Crear Nueva Nota
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- INPUT OCULTO PARA IMPORTAR JSON -->
<input type="file" id="jsonImportInput" accept=".json" style="display: none;" onchange="handleJSONImport(this)">

<!-- MODAL PARA AGREGAR/EDITAR ENLACE -->
<div class="modal fade" id="noteLinkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="bi bi-link-45deg text-orange me-2"></i>Enlace</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="noteLinkEditId" value="">
                <div class="mb-3">
                    <label for="noteLinkText" class="form-label small text-muted fw-bold">Texto del enlace</label>
                    <input type="text" id="noteLinkText" class="form-control rounded-pill border-0 bg-white bg-opacity-75" placeholder="Texto visible">
                </div>
                <div class="mb-3">
                    <label for="noteLinkUrl" class="form-label small text-muted fw-bold">URL</label>
                    <input type="url" id="noteLinkUrl" class="form-control rounded-pill border-0 bg-white bg-opacity-75" placeholder="https://...">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-success rounded-pill px-4 flex-grow-1" onclick="applyNoteLink()">
                        <i class="bi bi-check-lg me-1"></i>Aplicar
                    </button>
                    <button class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA SUBIR IMAGEN -->
<div class="modal fade" id="noteImageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="bi bi-image text-orange me-2"></i>Imagen</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="noteImageFile" class="form-label small text-muted fw-bold">Seleccionar imagen</label>
                    <input type="file" id="noteImageFile" class="form-control rounded-pill border-0 bg-white bg-opacity-75" accept="image/*" onchange="previewNoteImage(this)">
                </div>
                <div id="noteImagePreviewContainer" class="text-center mb-3 d-none">
                    <img id="noteImagePreview" class="img-fluid rounded-3" style="max-height: 200px;" alt="Vista previa">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-success rounded-pill px-4 flex-grow-1" onclick="applyNoteImage()">
                        <i class="bi bi-check-lg me-1"></i>Insertar
                    </button>
                    <button class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE VISTA DE NOTA -->
<div class="modal fade" id="noteViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" id="noteViewTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="noteViewContent" class="bg-white bg-opacity-75 rounded-3 p-4" style="min-height: 200px; max-height: 500px; overflow-y: auto;"></div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button class="btn btn-outline-primary rounded-pill px-3" onclick="exportViewNoteJPG()">
                        <i class="bi bi-image me-1"></i>JPG
                    </button>
                    <button class="btn btn-outline-info rounded-pill px-3" onclick="exportViewNotePNG()">
                        <i class="bi bi-file-earmark-image me-1"></i>PNG
                    </button>
                    <button class="btn btn-outline-success rounded-pill px-3" onclick="shareViewNoteWhatsApp()">
                        <i class="bi bi-whatsapp me-1"></i>WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
