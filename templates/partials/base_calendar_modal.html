    <!-- ========================================== -->
    <!-- MODAL GENERADOR DE CALENDARIO              -->
    <!-- ========================================== -->
    {% if session.get('role') == 'Superusuario' %}
    <div class="modal fade" id="calendarioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content glass-modal shadow-lg border-0 bg-light">
                <div class="modal-header border-bottom border-secondary border-opacity-25 pb-3">
                    <h5 class="modal-title fw-bold text-dark w-100"><i class="bi bi-calendar3 text-orange me-2"></i>Generador de Calendario HD</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-4">
                        <!-- PANEL DE HERRAMIENTAS (EDITOR) -->
                        <div class="col-lg-4">
                            <div class="editor-tools p-4 shadow-sm h-100 bg-white">
                                <h4 class="fw-bold mb-4 text-dark"><i class="bi bi-sliders text-orange me-2"></i>Configuración</h4>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark small">Formato del Arte</label>
                                    <select id="calFormatoArte" class="form-select bg-light border shadow-sm" onchange="cambiarFormatoArte()">
                                        <option value="horizontal">Horizontal (16:9) - Pantallas/TV</option>
                                        <option value="vertical">Vertical (9:16) - Celulares/Historias</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark small">Categoría (Filtro)</label>
                                    <!-- SELECTOR EXACTO SEGÚN LA IMAGEN ENVIADA -->
                                    <select id="calFiltroCategoria" class="form-select bg-light border shadow-sm" onchange="renderizarCalendario()">
                                        <option value="Todas">Todas las Actividades</option>
                                        <option value="Caminata">Caminata</option>
                                        <option value="Internacional">Internacional</option>
                                        <option value="Parque Nacional">Parque Nacional</option>
                                        <option value="El Camino de Costa Rica">El Camino de Costa Rica</option>
                                        <option value="Fiesta">Fiesta</option>
                                        <option value="Convivio">Convivio</option>
                                        <option value="Reunión">Reunión</option>
                                    </select>
                                </div>

                                <!-- Toggle de Precios -->
                                <div class="mb-3">
                                    <div class="form-check form-switch bg-light border shadow-sm p-2 rounded d-flex align-items-center justify-content-between px-3">
                                        <label class="form-check-label fw-bold text-dark small mb-0" for="calTogglePrecio">Mostrar Precios</label>
                                        <input class="form-check-input m-0" type="checkbox" id="calTogglePrecio" onchange="renderizarCalendario(); actualizarTextosCalendario();" checked>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark small">Título del Flyer</label>
                                    <input type="text" id="calInputTitulo" class="form-control bg-light border shadow-sm" value="CALENDARIO DE AVENTURAS" oninput="actualizarTextosCalendario()">
                                </div>

                                <!-- CAMPOS DE TEXTO ADICIONALES CON SLIDER DE TAMAÑO Y MARGEN -->
                                <div class="mb-3 p-3 bg-light rounded-3 border">
                                    <label class="form-label fw-bold text-dark small">Nota Adicional (Opcional)</label>
                                    <input type="text" id="calInputNota" class="form-control bg-white border shadow-sm mb-3" placeholder="Ej: Cupos limitados. Reserva pronto." oninput="actualizarTextosCalendario()">
                                    
                                    <label class="form-label text-dark small mb-0 d-flex justify-content-between fw-bold">
                                        <span><i class="bi bi-type me-1"></i>Tamaño de la Nota</span> <span id="calValNotaSize" class="text-orange">1.8rem</span>
                                    </label>
                                    <input type="range" class="form-range mb-3" id="calSliderNotaSize" min="0.8" max="4.0" step="0.1" value="1.8" oninput="actualizarTamanoNota()">

                                    <!-- NUEVO: DESPLAZADOR DE MÁRGENES LATERALES -->
                                    <label class="form-label text-dark small mb-0 d-flex justify-content-between fw-bold">
                                        <span><i class="bi bi-arrows-collapse me-1"></i>Márgenes Laterales</span> <span id="calValNotaMargin" class="text-orange">0px</span>
                                    </label>
                                    <input type="range" class="form-range" id="calSliderNotaMargin" min="0" max="600" step="10" value="0" oninput="actualizarTamanoNota()">
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label class="form-label fw-bold text-dark small">Teléfono</label>
                                        <input type="text" id="calInputPhone" class="form-control bg-light border shadow-sm" placeholder="8622-7500" oninput="actualizarTextosCalendario()">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label fw-bold text-dark small">SINPE (Opcional)</label>
                                        <input type="text" id="calInputSinpe" class="form-control bg-light border shadow-sm" placeholder="Número SINPE" oninput="actualizarTextosCalendario()">
                                    </div>
                                </div>

                                <hr class="my-4 opacity-25">

                                <!-- CONTROLES DE IMAGEN -->
                                <h6 class="fw-bold text-dark mb-3"><i class="bi bi-image text-orange me-2"></i>Diseño Visual</h6>
                                
                                <div class="mb-3">
                                    <label class="btn btn-outline-dark w-100 rounded shadow-sm text-start">
                                        <i class="bi bi-upload me-2"></i> Subir Imagen de Fondo
                                        <input type="file" id="calBgImageUpload" class="d-none" accept="image/*">
                                    </label>
                                </div>

                                <!-- CONTROL DE OSCURIDAD -->
                                <div class="mb-3">
                                    <label class="form-label text-dark small mb-0 d-flex justify-content-between">
                                        <span><i class="bi bi-circle-half me-1"></i>Oscuridad del Fondo</span> <span id="calValOscuridad">60%</span>
                                    </label>
                                    <input type="range" class="form-range" id="calSliderOscuridad" min="0" max="0.9" step="0.05" value="0.6" oninput="actualizarOpacidadOverlay()">
                                </div>
                                
                                <!-- CONTROL DE BLUR -->
                                <div class="mb-4">
                                    <label class="form-label text-dark small mb-0 d-flex justify-content-between">
                                        <span><i class="bi bi-droplet-half me-1"></i>Desenfoque (Blur)</span> <span id="calValBlur">8px</span>
                                    </label>
                                    <input type="range" class="form-range" id="calSliderBlur" min="0" max="20" step="1" value="8" oninput="renderizarFondoCanvas()">
                                </div>

                                <!-- CONTROL DE TAMAÑO DE CUADROS -->
                                <div class="mb-4 p-3 bg-light rounded-3 border">
                                    <label class="form-label text-dark small mb-0 d-flex justify-content-between fw-bold">
                                        <span><i class="bi bi-aspect-ratio me-1"></i>Tamaño de Cuadros</span> <span id="calValCardSize" class="text-orange">100%</span>
                                    </label>
                                    <small class="text-muted d-block mb-2" style="font-size: 0.65rem;">Se auto-ajustarán en cascada si no caben.</small>
                                    <input type="range" class="form-range" id="calSliderCardSize" min="0.6" max="2.0" step="0.05" value="1" oninput="actualizarTamanoTarjetas()">
                                </div>

                                <div class="image-editor-controls">
                                    <div class="mb-3">
                                        <label class="form-label text-dark small mb-0 d-flex justify-content-between">
                                            <span><i class="bi bi-zoom-in me-1"></i>Escala</span> <span id="calValScale">1.0</span>
                                        </label>
                                        <input type="range" class="form-range" id="calSliderScale" min="0.5" max="3" step="0.1" value="1" oninput="renderizarFondoCanvas()">
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label text-dark small mb-0 d-flex justify-content-between">
                                            <span><i class="bi bi-arrows-move me-1"></i>Posición (X)</span> <span id="calValX">0</span>
                                        </label>
                                        <input type="range" class="form-range" id="calSliderX" min="-1000" max="1000" step="10" value="0" oninput="renderizarFondoCanvas()">
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label class="form-label text-dark small mb-0 d-flex justify-content-between">
                                            <span><i class="bi bi-arrows-vertical me-1"></i>Posición (Y)</span> <span id="calValY">0</span>
                                        </label>
                                        <input type="range" class="form-range" id="calSliderY" min="-1000" max="1000" step="10" value="0" oninput="renderizarFondoCanvas()">
                                    </div>
                                </div>

                                <button onclick="descargarArteCalendario()" class="btn btn-primary btn-orange w-100 fw-bold rounded-pill shadow-sm py-2 mt-4">
                                    <i class="bi bi-download me-2"></i>Descargar Arte HD
                                </button>
                            </div>
                        </div>

                        <!-- ÁREA DEL LIENZO -->
                        <div class="col-lg-8">
                            <!-- Hint para el usuario -->
                            <div class="alert alert-info rounded-pill text-center mb-3 py-2 shadow-sm border-0 bg-opacity-10 text-dark">
                                <i class="bi bi-info-circle-fill me-2 text-orange"></i>
                                <small>El texto del botón inferior <strong>está asegurado</strong> y no se cortará en el archivo final.</small>
                            </div>

                            <div id="flyer-wrapper">
                                <!-- Lienzo Dinámico (Cambia de tamaño por JS) -->
                                <div id="lienzo-arte">
                                    
                                    <!-- AQUI ESTA LA MAGIA DEL BLUR NATIVO: Usamos un Canvas en lugar de un IMG. HTML2Canvas captura esto 100% perfecto -->
                                    <canvas id="cal-flyer-bg-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>
                                    
                                    <!-- Capa oscura -->
                                    <div class="overlay-oscuro" id="cal-overlay-oscuro"></div>

                                    <div class="calendario-contenido">
                                        <!-- Cabecera -->
                                        <div class="text-center mb-5 flex-shrink-0">
                                            <h1 id="cal-flyer-titulo" class="display-3 fw-black text-white text-uppercase" style="font-weight: 900; letter-spacing: 3px; text-shadow: 2px 4px 10px rgba(0,0,0,0.8);">
                                                CALENDARIO DE AVENTURAS
                                            </h1>
                                            <p id="cal-flyer-subtitulo" class="fs-2 text-orange fw-bold mt-2" style="text-shadow: 1px 2px 5px rgba(0,0,0,0.8);">Todas las Actividades</p>
                                        </div>

                                        <!-- Grilla de Meses (Inyectada por JS, con nuevo motor CSS Grid) -->
                                        <div id="cal-grid-meses" class="row g-4 flex-grow-1 align-content-start pb-4">
                                            <!-- JS inserta las tarjetas aquí -->
                                        </div>

                                        <!-- Footer Institucional de La Tribu -->
                                        <div style="position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; z-index: 10;">
                                            <!-- Nota Adicional Dinámica -->
                                            <h3 id="cal-flyer-nota" class="text-white fw-bold mb-3" style="text-shadow: 2px 2px 6px rgba(0,0,0,0.9); font-family: 'Segoe UI', Arial, sans-serif; word-wrap: break-word; white-space: normal;"></h3>
                                            
                                            <!-- BOTÓN MODIFICADO: Más padding lateral, texto blanco con sombra -->
                                            <div style="display: inline-block; background-color: #ff8c00; border-radius: 80px; padding: 18px 80px; border: 4px solid #000000; white-space: nowrap;">
                                                <table style="margin: 0 auto; border-collapse: collapse;">
                                                    <tr>
                                                        <td style="padding-right: 20px; vertical-align: middle;">
                                                            <!-- Icono SVG Blanco con Sombra -->
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffffff" viewBox="0 0 16 16" style="filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));">
                                                              <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
                                                            </svg>
                                                        </td>
                                                        <td style="vertical-align: middle;">
                                                            <!-- TEXTO BLANCO CON SOMBRA NEGRA (MÁS COMPACTO Y CENTRADO) -->
                                                            <span id="cal-flyer-contacto" style="color: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-size: 26px; font-weight: 900; font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 1.5px; line-height: 1;"></span>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- SCRIPT DE TAMAÑO Y MARGEN DE NOTA (Se inyecta localmente para que funcione al instante) -->
    <script>
        function actualizarTamanoNota() {
            const size = document.getElementById('calSliderNotaSize').value;
            const margin = document.getElementById('calSliderNotaMargin').value;
            
            const valTextSize = document.getElementById('calValNotaSize');
            const valTextMargin = document.getElementById('calValNotaMargin');
            const notaEl = document.getElementById('cal-flyer-nota');
            
            if(valTextSize) valTextSize.innerText = size + 'rem';
            if(valTextMargin) valTextMargin.innerText = margin + 'px';
            
            if(notaEl) {
                notaEl.style.fontSize = size + 'rem';
                notaEl.style.paddingLeft = margin + 'px';
                notaEl.style.paddingRight = margin + 'px';
            }
            
            // Guardado en memoria
            localStorage.setItem('cal_nota_size', size);
            localStorage.setItem('cal_nota_margin', margin);
        }

        // Cargar el tamaño y margen guardado al abrir el Modal
        document.addEventListener('DOMContentLoaded', () => {
            const modalCal = document.getElementById('calendarioModal');
            if(modalCal) {
                modalCal.addEventListener('shown.bs.modal', function () {
                    const savedSize = localStorage.getItem('cal_nota_size');
                    const savedMargin = localStorage.getItem('cal_nota_margin');
                    
                    if (savedSize) {
                        const sliderSize = document.getElementById('calSliderNotaSize');
                        if(sliderSize) sliderSize.value = savedSize;
                    }
                    if (savedMargin) {
                        const sliderMargin = document.getElementById('calSliderNotaMargin');
                        if(sliderMargin) sliderMargin.value = savedMargin;
                    }
                    
                    actualizarTamanoNota();
                });
            }
        });
    </script>
    {% endif %}
