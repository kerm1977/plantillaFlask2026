<!-- MODAL PARA AGREGAR/EDITAR ENLACE -->
<div class="modal fade" id="noteLinkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="bi bi-link-45deg text-orange me-2"></i>Enlace</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="noteLinkEditId" value="">
                <div class="mb-3">
                    <label for="noteLinkText" class="form-label small text-muted fw-bold">Texto del enlace</label>
                    <input type="text" id="noteLinkText" class="form-control rounded-pill border-0 bg-white bg-opacity-75" placeholder="Texto visible">
                </div>
                <div class="mb-3">
                    <label for="noteLinkUrl" class="form-label small text-muted fw-bold">URL</label>
                    <input type="url" id="noteLinkUrl" class="form-control rounded-pill border-0 bg-white bg-opacity-75" placeholder="https://...">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-success rounded-pill px-4 flex-grow-1" onclick="applyNoteLink()">
                        <i class="bi bi-check-lg me-1"></i>Aplicar
                    </button>
                    <button class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE ENLACE PÚBLICO DE NOTA -->
<div class="modal fade" id="notePublicLinkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark"><i class="bi bi-link-45deg text-orange me-2"></i>Enlace Público</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted">Cualquier persona con este enlace podrá ver y editar esta nota libremente, sin necesidad de clave.</p>
                <div class="input-group mb-3">
                    <input type="text" id="notePublicLinkInput" class="form-control rounded-start-pill border-0 bg-white bg-opacity-75" readonly>
                    <button class="btn btn-orange rounded-end-pill" id="copyPublicLinkBtn" onclick="copyPublicLink()">
                        <i class="bi bi-clipboard me-1"></i>Copiar
                    </button>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-danger rounded-pill px-4 flex-grow-1" onclick="unshareCurrentNote()">
                        <i class="bi bi-link-45deg me-1"></i>Desactivar Enlace
                    </button>
                    <button class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg me-1"></i>Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
