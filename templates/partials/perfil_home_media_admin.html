<!-- Administración del carrusel del home -->
{% if session.get('role') == 'Superusuario' %}
<button class="btn bg-white rounded-pill px-4 shadow-sm fw-bold w-100 w-sm-auto" style="color: #6f42c1; border: 2px solid #6f42c1;" data-bs-toggle="modal" data-bs-target="#homeMediaAdminModal">
    <i class="bi bi-images me-2"></i>Administrar Carrusel
</button>

<div class="modal fade" id="homeMediaAdminModal" tabindex="-1" aria-labelledby="homeMediaAdminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold text-dark" id="homeMediaAdminModalLabel"><i class="bi bi-images text-orange me-2"></i>Administración de imágenes, videos y enlaces</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body px-4">
                <form id="homeMediaForm" enctype="multipart/form-data">
                    <input type="hidden" id="hmId" value="">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Tipo</label>
                            <select class="form-select glass-input" id="hmType" name="type" required>
                                <option value="image">Imagen</option>
                                <option value="youtube">Video YouTube</option>
                                <option value="facebook">Video Facebook</option>
                                <option value="link">Enlace</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">Título</label>
                            <input type="text" class="form-control glass-input" id="hmTitle" name="title" placeholder="Opcional">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-secondary">Orden</label>
                            <input type="number" class="form-control glass-input" id="hmOrder" name="sort_order" value="0" min="0">
                        </div>
                    </div>
                    <div class="mb-3" id="hmUrlGroup">
                        <label class="form-label fw-bold text-secondary">URL</label>
                        <input type="url" class="form-control glass-input" id="hmUrl" name="url" placeholder="https://...">
                    </div>
                    <div class="mb-3 d-none" id="hmFileGroup">
                        <label class="form-label fw-bold text-secondary">Archivo de imagen</label>
                        <input type="file" class="form-control glass-input" id="hmFile" name="file" accept="image/*">
                        <div id="hmPreview" class="mt-2"></div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="hmActive" name="is_active" value="true" checked>
                        <label class="form-check-label fw-bold text-secondary" for="hmActive">Activo</label>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="button" id="homeMediaNewBtn" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">Nuevo</button>
                        <button type="submit" id="homeMediaSaveBtn" class="btn btn-orange rounded-pill px-4 fw-bold">Agregar</button>
                    </div>
                </form>

                <hr class="my-4 opacity-25">

                <h6 class="fw-bold text-dark mb-3">Elementos del carrusel</h6>
                <div id="homeMediaList" class="small"></div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/home_media_admin.js') }}"></script>
{% endif %}
