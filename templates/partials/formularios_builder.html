            <div class="col-lg-6">
                <div class="card glass-panel border-0 shadow-sm sticky-top" style="top: 80px;">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center justify-content-between mb-4">
                            <h5 class="fw-bold mb-0 fs-5"><i class="bi bi-hammer text-orange me-2"></i>Constructor</h5>
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-2 fw-semibold" onclick="backToList()">
                                <i class="bi bi-arrow-left me-1"></i>Volver
                            </button>
                        </div>

                        <!-- Config -->
                        <div class="mb-4 p-3 rounded-4" style="background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.06);">
                            <label class="fw-semibold small text-muted d-block mb-2">Configuración del Formulario</label>
                            <div class="row g-3">
                                <div class="col-12">
                                    <input type="text" id="formName" class="form-control form-control-lg fw-bold rounded-3" placeholder="Nombre del Formulario" oninput="updatePreview()">
                                </div>
                                <div class="col-6">
                                    <label class="fw-semibold small text-muted d-block mb-1">Tipo</label>
                                    <select id="formType" class="form-select form-select-sm rounded-3" onchange="onFormTypeChange();updatePreview()">
                                        <option value="registro">Registro</option>
                                        <option value="examen">Examen</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="fw-semibold small text-muted d-block mb-1">Edición</label>
                                    <select id="formAllowEdit" class="form-select form-select-sm rounded-3">
                                        <option value="false">No editable</option>
                                        <option value="true">Editable</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Triggers -->
                        <div class="mb-4 p-3 rounded-4" style="background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.06);">
                            <label class="fw-semibold small text-muted d-block mb-2"><i class="bi bi-eye me-1"></i>Campos visibles</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigNombre" checked onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigNombre">Nombre</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigFecha" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigFecha">Fecha</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigEmail" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigEmail">Email</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigEdad" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigEdad">Edad</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigTelefono" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigTelefono">Teléfono</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigCedula" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigCedula">Cédula</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigFichaMedica" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigFichaMedica">Ficha Médica</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigPasaporte" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigPasaporte">Pasaporte</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="trigFechaNacimiento" onchange="updatePreview()">
                                        <label class="form-check-label small" for="trigFechaNacimiento">Fecha Nacimiento</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Preguntas -->
                        <div class="mb-4">
                            <label class="fw-semibold small text-muted d-block mb-2">Preguntas del Formulario</label>
                            <div id="fieldsContainer" style="max-height: 35vh; overflow-y: auto;"></div>
                        </div>

                        <!-- Botones de agregar campo -->
                        <div class="mb-4 p-3 rounded-4" style="background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.06);">
                            <label class="fw-semibold small text-muted d-block mb-2">Agregar Campo</label>
                            <div class="d-flex gap-2 flex-wrap">
                                <button class="btn btn-outline-orange btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="addField('text')">
                                    <i class="bi bi-type me-1"></i>Respuesta corta
                                </button>
                                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="addField('textarea')">
                                    <i class="bi bi-text-paragraph me-1"></i>Respuesta larga
                                </button>
                                <button class="btn btn-outline-orange btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="addField('radio')">
                                    <i class="bi bi-record-circle me-1"></i>Única selección
                                </button>
                                <button class="btn btn-outline-orange btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="addField('checkbox')">
                                    <i class="bi bi-check2-square me-1"></i>Múltiple selección
                                </button>
                                <button class="btn btn-outline-orange btn-sm rounded-pill px-3 py-2 fw-semibold" onclick="addField('file')">
                                    <i class="bi bi-paperclip me-1"></i>Archivo
                                </button>
                            </div>
                        </div>

                        <!-- Números de reserva -->
                        <div class="mb-4 p-3 rounded-4" style="background:rgba(255,140,0,0.05);border:1px solid rgba(255,140,0,0.12);" id="reservationSection">
                            <label class="fw-semibold small text-muted d-block mb-2"><i class="bi bi-ticket-perforated text-orange me-1"></i>Números de Reserva</label>
                            <p class="small text-secondary mb-2">Ingresa los números de reserva disponibles para este formulario. Puedes escribirlos uno por línea o separados por comas.</p>
                            <textarea id="formReservationNumbers" class="form-control rounded-3 mb-2" rows="4" placeholder="Ejemplo:&#10;RES-001&#10;RES-002&#10;RES-003"></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end border-top pt-3">
                            <button class="btn btn-orange rounded-pill px-5 py-2 fw-bold shadow-sm" onclick="saveForm()">
                                <i class="bi bi-check-lg me-1"></i>Guardar Formulario
                            </button>
                        </div>
                    </div>
                </div>
            </div>
