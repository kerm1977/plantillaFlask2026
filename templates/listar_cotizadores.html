{% extends "base.html" %}
{% block title %}Configuración de Cotizador - La Tribu{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="mb-4">
        <h2 class="fw-bold text-orange">Configuración de Cotizador</h2>
    </div>
    <div class="row">
        {% for cot in cotizadores %}
        <div class="col-12 col-md-6 col-lg-4 mb-3">
            <div class="card glass-panel border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label small text-muted fw-bold">Nombre del Cotizador</label>
                        <input type="text" class="form-control" value="{{ cot.nombre }}" id="nombre-{{ cot.id }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted fw-bold">Clave de Acceso</label>
                        <input type="text" class="form-control" value="{{ cot.clave_acceso }}" id="clave-{{ cot.id }}">
                    </div>
                    <p class="small text-muted mb-3">
                        <i class="bi bi-map me-1"></i>{{ cot.lugares|length }} lugar(es)
                    </p>
                    <div class="d-flex gap-2">
                        <button onclick="guardarConfig({{ cot.id }})" class="btn btn-sm btn-primary flex-grow-1">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                        <a href="/cotizador/{{ cot.slug }}" target="_blank" class="btn btn-sm btn-outline-primary flex-grow-1">
                            <i class="bi bi-link-45deg me-1"></i>Enlace
                        </a>
                        <a href="/cotizadores/{{ cot.id }}/editar" class="btn btn-sm btn-outline-success flex-grow-1">
                            <i class="bi bi-pencil me-1"></i>Lugares
                        </a>
                        <button onclick="eliminarCotizador({{ cot.id }})" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script>
function guardarConfig(id) {
    const nombre = document.getElementById('nombre-' + id).value.trim();
    const clave = document.getElementById('clave-' + id).value.trim();
    if(!nombre || !clave) return alert('Nombre y clave son obligatorios');
    
    fetch('/cotizadores/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({nombre, clave, lugares: []})
    })
    .then(r => r.json())
    .then(d => {
        if(d.ok) alert('Configuración guardada correctamente');
        else alert(d.error || 'Error');
    });
}
function eliminarCotizador(id) {
    if (confirm('¿Eliminar este cotizador?')) {
        fetch('/cotizadores/' + id + '/eliminar', {method: 'POST'})
        .then(r => r.json()).then(d => { if(d.ok) location.reload(); });
    }
}
</script>
{% endblock %}
