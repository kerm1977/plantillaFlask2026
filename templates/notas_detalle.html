<!-- ==============================================================
     BLINDADO - NO MODIFICAR SIN PERMISO EXPLICITO DEL DUENO
     Explicar antes de editar. Contenido sagrado protegido.
============================================================== -->
{% extends "base.html" %}

{% block content %}
<style>
    #notePageEditor a {
        color: #ff8c00;
        font-weight: bold;
        text-decoration: underline;
    }
    #notePageEditor .form-check-input {
        cursor: pointer;
    }
    #notePageEditor .todo-list .list-group-item {
        border: 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        background: rgba(255, 255, 255, 0.5);
    }
    #notePageEditor .todo-list li,
    #notePageEditor .todo-list .list-group-item {
        display: flex !important;
        align-items: flex-start !important;
        gap: 0.5rem !important;
        padding-left: 0 !important;
        margin-left: 0 !important;
        list-style: none !important;
    }
    #notePageEditor .todo-list .form-check-input {
        margin-top: 0.2em !important;
        flex-shrink: 0 !important;
    }
    #notePageEditor .todo-list .form-check-label {
        word-break: break-word;
        flex: 1;
        margin-bottom: 0;
    }
    #notePageEditor .todo-list .form-check-input:checked + .form-check-label {
        text-decoration: line-through;
        opacity: 0.6;
    }
    #notePageEditor:empty:before {
        content: 'Escribe aquí...';
        color: #adb5bd;
    }
    #notePageEditor img {
        max-width: 100%;
        height: auto;
    }
</style>

<div class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="glass-panel rounded-4 p-3 p-md-5 shadow-lg">
                <input type="text" id="notePageTitle" class="form-control form-control-lg rounded-pill border-0 bg-white bg-opacity-75 text-center fw-bold text-dark mb-3" value="{{ note.title }}" placeholder="Título de la nota" oninput="pageScheduleSave()">
                <p class="text-muted small text-center mb-3">
                    <i class="bi bi-clock-history me-1"></i>Actualizado: {{ note.updated_at.strftime('%d/%m/%Y %H:%M') }}
                    <span id="notePageSaveStatus" class="ms-2"></span>
                </p>

                <!-- BARRA DE HERRAMIENTAS WYSIWYG -->
                <div class="d-flex flex-wrap gap-1 mb-2 p-2 bg-white bg-opacity-50 rounded-3">
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('bold')" title="Negrita"><i class="bi bi-type-bold"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('italic')" title="Itálica"><i class="bi bi-type-italic"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('underline')" title="Subrayado"><i class="bi bi-type-underline"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('strikeThrough')" title="Tachado"><i class="bi bi-type-strikethrough"></i></button>
                    <div class="vr mx-1"></div>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('justifyLeft')" title="Izquierda"><i class="bi bi-text-left"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('justifyCenter')" title="Centro"><i class="bi bi-text-center"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('justifyRight')" title="Derecha"><i class="bi bi-text-right"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('justifyFull')" title="Justificado"><i class="bi bi-justify"></i></button>
                    <div class="vr mx-1"></div>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('insertUnorderedList')" title="Viñetas"><i class="bi bi-list-ul"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageExecCmd('insertOrderedList')" title="Numeración"><i class="bi bi-list-ol"></i></button>
                    <div class="vr mx-1"></div>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageInsertCheckbox()" title="To-do"><i class="bi bi-check-square"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="pageInsertLink()" title="Enlace"><i class="bi bi-link-45deg"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="document.getElementById('notePageImageFile').click()" title="Imagen"><i class="bi bi-image"></i></button>
                    <button class="btn btn-sm btn-light rounded-circle" onclick="openEmojiPicker('notePageEditor')" title="Emoji"><i class="bi bi-emoji-smile"></i></button>
                    <div class="vr mx-1 d-none d-sm-block"></div>
                    <button class="btn btn-sm btn-success rounded-circle" onclick="savePageNote()" title="Guardar"><i class="bi bi-check-lg"></i></button>
                    <input type="file" id="notePageImageFile" accept="image/*" style="display:none;" onchange="pageUploadImage(this)">
                </div>

                <!-- ÁREA DE EDICIÓN -->
                <div id="notePageEditor" contenteditable="true" class="form-control bg-white bg-opacity-75 border-0 rounded-3 p-3 p-md-4" style="min-height: 200px; max-height: 500px; overflow-y: auto; font-size: 1.05rem; line-height: 1.6;" oninput="pageScheduleSave()">
                    {{ note.content|safe }}
                </div>

                <hr class="my-4" style="border-top: 2px solid rgba(255,140,0,0.3);">

                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <button class="btn btn-info rounded-pill px-4 shadow-sm" onclick="exportPageNotePNG()">
                        <i class="bi bi-file-earmark-image me-2"></i>PNG
                    </button>
                    <button class="btn btn-danger rounded-pill px-4 shadow-sm" onclick="exportPageNotePDF()">
                        <i class="bi bi-filetype-pdf me-2"></i>PDF
                    </button>
                    <button class="btn btn-success rounded-pill px-4 shadow-sm" onclick="sharePageNoteWhatsApp()">
                        <i class="bi bi-whatsapp me-2"></i>WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const NOTE_ID = parseInt('{{ note.id }}', 10);
</script>
<script src="{{ url_for('static', filename='js/notas_detalle.js') }}"></script>
{% endblock %}
