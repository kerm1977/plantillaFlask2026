{% extends "base.html" %}
{% block title %}{{ cotizador.nombre }} - Ver Cotizador{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:1000px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
            <h2 class="fw-bold text-orange mb-0">{{ cotizador.nombre }}</h2>
            <a href="/cotizadores/{{ cotizador.id }}/editar" class="btn btn-sm btn-outline-orange">
                <i class="bi bi-pencil"></i>
            </a>
        </div>
        <a href="/cotizadores/lista" class="btn btn-outline-orange">
            <i class="bi bi-arrow-left me-2"></i>Volver
        </a>
    </div>
    
    <div class="mb-3">
        <span class="badge bg-info"><i class="bi bi-link me-1"></i>{{ cotizador.slug }}</span>
        <span class="badge bg-secondary"><i class="bi bi-lock me-1"></i>{{ cotizador.clave_acceso }}</span>
    </div>
    
    <div id="lugaresContainer" class="row g-4"></div>
    
    <div class="mt-4 pt-3 border-top">
        <button onclick="eliminarCotizador()" class="btn btn-danger">
            <i class="bi bi-trash me-2"></i>Eliminar Cotizador
        </button>
    </div>
</div>

<!-- Modal Editar Lugar -->
<div class="modal fade" id="editarLugarModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-modal border-0 shadow-lg">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-pencil-fill text-orange me-2"></i>Editar Lugar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4">
                <input type="hidden" id="editLugarId">
                <div class="mb-3">
                    <label class="form-label fw-bold small">Nombre del lugar</label>
                    <input type="text" id="editLugarNombre" class="form-control rounded-pill">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Provincia</label>
                    <input type="text" id="editLugarProvincia" class="form-control rounded-pill">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Mapa Ida (URL)</label>
                    <input type="text" id="editLugarMapsIda" class="form-control rounded-pill">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Mapa Regreso (URL)</label>
                    <input type="text" id="editLugarMapsRegreso" class="form-control rounded-pill">
                </div>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label fw-bold small">Fecha</label>
                        <input type="text" id="editLugarFecha" class="form-control rounded-pill">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small">Hora</label>
                        <input type="text" id="editLugarHora" class="form-control rounded-pill">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4 gap-2">
                <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-orange rounded-pill px-4 py-2 fw-bold" onclick="guardarEdicionLugar()">
                    <i class="bi bi-check2 me-1"></i>Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<script>
const cotizadorId = {{ cotizador.id }};
const lugaresData = {{ lugares_json|tojson|safe }};
function renderLugares() {
    const html = lugaresData.map(l => `
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm" style="background:linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(248,249,250,0.9) 100%);backdrop-filter:blur(10px);border-radius:15px;">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h6 class="fw-bold mb-0 text-truncate" title="${l.nombre}" style="flex:1">${l.nombre}</h6>
                        <div class="ms-2">
                            <button onclick="editarLugar(${l.id})" class="btn btn-sm btn-outline-orange me-1">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button onclick="eliminarLugar(${l.id})" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        ${l.provincia ? `<span class="badge bg-light text-dark me-1"><i class="bi bi-geo-alt-fill me-1"></i>${l.provincia}</span>` : ''}
                        <span class="badge ${l.duracion=='1_dia'?'bg-info':'bg-warning text-dark'}">${l.duracion=='1_dia'?'1 día':'Múltiples'}</span>
                    </div>
                    <div class="small text-muted mb-3">
                        <div class="mb-1"><i class="bi bi-calendar-event me-1"></i>${l.fecha_ida || 'Por definir'}</div>
                        <div><i class="bi bi-clock me-1"></i>${l.hora || 'Por definir'}</div>
                    </div>
                    <div class="mb-3 d-flex gap-3">
                        ${l.maps_ida ? `<a href="${l.maps_ida}" target="_blank" class="btn btn-sm btn-outline-orange flex-fill text-center" title="Mapa de inicio" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de inicio</a>` : '<span class="btn btn-sm btn-outline-orange flex-fill text-center disabled" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de inicio</span>'}
                        ${l.maps_regreso ? `<a href="${l.maps_regreso}" target="_blank" class="btn btn-sm btn-outline-secondary flex-fill text-center" title="Mapa de recogida" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de recogida</a>` : '<span class="btn btn-sm btn-outline-secondary flex-fill text-center disabled" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de recogida</span>'}
                    </div>
                    <div class="mt-3 pt-3 border-top">
                        <div class="input-group">
                            <span class="input-group-text ${l.moneda=='colones'?'bg-success text-white':'bg-primary text-white'}">${l.moneda=='colones'?'₡':'$'}</span>
                            <input type="number" class="form-control form-control-sm fw-bold" id="precio_${l.id}" value="${(l.precio == null || l.precio === '' || l.precio === undefined) ? '' : Math.trunc(parseFloat(l.precio))}" placeholder="Precio" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    document.getElementById('lugaresContainer').innerHTML = html;
}
function editarLugar(id) {
    const lugar = lugaresData.find(l => l.id === id);
    if(!lugar) return;
    document.getElementById('editLugarId').value = lugar.id;
    document.getElementById('editLugarNombre').value = lugar.nombre || '';
    document.getElementById('editLugarProvincia').value = lugar.provincia || '';
    document.getElementById('editLugarMapsIda').value = lugar.maps_ida || '';
    document.getElementById('editLugarMapsRegreso').value = lugar.maps_regreso || '';
    document.getElementById('editLugarFecha').value = lugar.fecha_ida || '';
    document.getElementById('editLugarHora').value = lugar.hora || '';
    new bootstrap.Modal(document.getElementById('editarLugarModal')).show();
}
function guardarEdicionLugar() {
    const id = parseInt(document.getElementById('editLugarId').value, 10);
    const lugar = lugaresData.find(l => l.id === id);
    if(!lugar) return;
    lugar.nombre = document.getElementById('editLugarNombre').value;
    lugar.provincia = document.getElementById('editLugarProvincia').value;
    lugar.maps_ida = document.getElementById('editLugarMapsIda').value;
    lugar.maps_regreso = document.getElementById('editLugarMapsRegreso').value;
    lugar.fecha_ida = document.getElementById('editLugarFecha').value;
    lugar.hora = document.getElementById('editLugarHora').value;
    bootstrap.Modal.getInstance(document.getElementById('editarLugarModal')).hide();
    guardarLugar(id);
}
async function guardarLugar(id) {
    const lugar = lugaresData.find(l => l.id === id);
    const res = await fetch('/cotizadores/lugar/' + id, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(lugar)});
    const d = await res.json();
    if(d.ok) renderLugares();
    else alert(d.error || 'Error');
}
function eliminarLugar(id) {
    abrirModalBorrarUnificado({
        titulo: 'Eliminar Lugar',
        mensaje: '¿Estás seguro de eliminar este lugar?',
        onConfirmar: async () => {
            const res = await fetch('/cotizadores/lugar/' + id, {method:'DELETE'});
            const d = await res.json();
            if(d.ok) {
                const idx = lugaresData.findIndex(l => l.id === id);
                if(idx > -1) lugaresData.splice(idx, 1);
                renderLugares();
            } else {
                alert(d.error || 'Error');
            }
        }
    });
}
function eliminarCotizador() {
    abrirModalBorrarUnificado({
        titulo: 'Eliminar Cotizador',
        mensaje: '¿Estás seguro de eliminar este cotizador?',
        onConfirmar: async () => {
            const res = await fetch('/cotizadores/{{ cotizador.id }}/eliminar', {method:'POST'});
            const d = await res.json();
            if(d.ok) window.location.href = '/cotizadores';
            else alert(d.error || 'Error');
        }
    });
}


renderLugares();
</script>
{% endblock %}
