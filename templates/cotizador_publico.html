{% extends "base.html" %}
{% block title %}{{ cotizador.nombre }} - Cotizador{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:1000px">
    <h2 class="fw-bold text-orange mb-4 text-center">{{ cotizador.nombre }}</h2>
    
    <div id="cotizadorSection" class="d-none">
        <div id="lugaresContainer" class="row g-4 mt-2"></div>
        <button onclick="guardarPrecios()" class="btn btn-success w-100 mt-4 py-3 fw-bold btn-lg">
            <i class="bi bi-save me-2"></i>Guardar Precios
        </button>
    </div>
</div>

<!-- Modal de Contraseña -->
<div class="modal fade" id="passwordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Acceso Requerido</h5>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Clave de Acceso</label>
                    <input type="password" class="form-control form-control-lg" id="clave" placeholder="Ingresa la clave">
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="verificarClave()" class="btn btn-primary btn-lg w-100">Acceder</button>
            </div>
        </div>
    </div>
</div>
<script>
const slug = '{{ cotizador.slug }}';
const lugaresData = {{ lugares_json|tojson|safe }};
let claveGuardada = '';
let passwordModal;

document.addEventListener('DOMContentLoaded', function() {
    passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));
    passwordModal.show();
});

async function verificarClave() {
    const clave = document.getElementById('clave').value.trim();
    const res = await fetch('/cotizadores/' + slug + '/verificar', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave})});
    const d = await res.json();
    if(d.ok) {
        claveGuardada = clave;
        passwordModal.hide();
        document.getElementById('cotizadorSection').classList.remove('d-none');
        renderLugares();
    } else {
        alert('Clave incorrecta');
    }
}
function renderLugares() {
    // Agrupar lugares por provincia
    const grupos = {};
    lugaresData.forEach(l => {
        const provincia = l.provincia || 'Sin provincia';
        if(!grupos[provincia]) grupos[provincia] = [];
        grupos[provincia].push(l);
    });
    
    let html = '';
    for(const [provincia, lugares] of Object.entries(grupos)) {
        html += `
            <div class="col-12 mb-4">
                <h4 class="fw-bold text-orange mb-0">${provincia}</h4>
                <hr class="mt-2 mb-3">
            </div>
        `;
        html += lugares.map(l => `
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="card h-100 border-0 shadow-sm" style="background:linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(248,249,250,0.9) 100%);backdrop-filter:blur(10px);border-radius:15px;">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3 text-truncate" title="${l.nombre}">${l.nombre}</h6>
                        <div class="mb-3">
                            <span class="badge ${l.duracion=='1_dia'?'bg-info':'bg-warning text-dark'}">${l.duracion=='1_dia'?'1 día':'Múltiples'}</span>
                        </div>
                        <div class="small text-muted mb-3">
                            <div class="mb-1"><i class="bi bi-calendar-event me-1"></i>${l.fecha_ida || 'Por definir'}</div>
                            <div><i class="bi bi-clock me-1"></i>${l.hora || 'Por definir'}</div>
                        </div>
                        <div class="mb-3 d-flex gap-3">
                            ${l.maps_ida ? `<a href="${l.maps_ida}" target="_blank" class="btn btn-sm btn-outline-primary flex-fill text-center" title="Mapa de inicio" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de inicio</a>` : '<span class="btn btn-sm btn-outline-primary flex-fill text-center disabled" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de inicio</span>'}
                            ${l.maps_regreso ? `<a href="${l.maps_regreso}" target="_blank" class="btn btn-sm btn-outline-secondary flex-fill text-center" title="Mapa de recogida" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de recogida</a>` : '<span class="btn btn-sm btn-outline-secondary flex-fill text-center disabled" style="border-radius:20px"><i class="bi bi-geo-alt-fill"></i> Mapa de recogida</span>'}
                        </div>
                        <div class="mt-3 pt-3 border-top">
                            <div class="input-group">
                                <span class="input-group-text ${l.moneda=='colones'?'bg-success text-white':'bg-primary text-white'}">${l.moneda=='colones'?'₡':'$'}</span>
                                <input type="number" class="form-control form-control-sm fw-bold" id="precio_${l.id}" value="${l.precio||''}" placeholder="Precio">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }
    document.getElementById('lugaresContainer').innerHTML = html;
}
async function guardarPrecios() {
    const precios = {};
    lugaresData.forEach(l => {
        const precio = document.getElementById('precio_' + l.id).value;
        if(precio) precios[l.id] = precio;
    });
    const res = await fetch('/cotizadores/' + slug + '/guardar', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clave:claveGuardada,precios})});
    const d = await res.json();
    if(d.ok) alert('Precios guardados correctamente');
    else alert(d.error || 'Error');
}
</script>
{% endblock %}
