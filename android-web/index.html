<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8c00">
  <title>La Tribu</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff3e0;color:#242424;font-family:system-ui,sans-serif}.card{width:min(92%,32rem);padding:2rem;text-align:center;background:#fff;border-radius:1.5rem;box-shadow:0 1rem 3rem #0002}.logo{width:7rem;height:7rem;object-fit:contain}.status{margin:1rem 0;color:#666}.button{display:block;width:100%;margin:.75rem 0;padding:.9rem;border:0;border-radius:2rem;background:#ff8c00;color:#fff;font-weight:700}.button.secondary{background:#198754}.button:disabled{opacity:.55}.progress{width:100%;height:.75rem}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://www.latribu.top/static/logo.png" alt="La Tribu">
    <h1>La Tribu</h1>
    <p id="status" class="status">Comprobando conexión con el servidor…</p>
    <button id="onlineButton" class="button">Abrir aplicación en línea</button>
    <button id="offlineButton" class="button secondary">Abrir información offline</button>
    <button id="downloadButton" class="button secondary">Cargar toda la información offline</button>
    <progress id="progress" class="progress hidden" max="100" value="0"></progress>
    <p id="detail" class="status"></p>
  </main>
  <script>
    const SERVER_URL = 'https://www.latribu.top';
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const progress = document.getElementById('progress');
    const onlineButton = document.getElementById('onlineButton');
    const offlineButton = document.getElementById('offlineButton');
    const downloadButton = document.getElementById('downloadButton');
    async function checkConnection(){
      try{const response=await fetch(`${SERVER_URL}/manifest.json`,{cache:'no-store'});if(!response.ok)throw new Error();status.textContent='Servidor conectado';return true}catch(error){status.textContent='El servidor se encuentra desconectado. Podés abrir una copia descargada.';return false}
    }
    onlineButton.addEventListener('click',()=>location.href=SERVER_URL);
    offlineButton.addEventListener('click',()=>{detail.textContent='Todavía no existe una descarga offline completa en este dispositivo.'});
    downloadButton.addEventListener('click',()=>{detail.textContent='Ingresá primero a la aplicación en línea como superusuario para autorizar la descarga.';location.href=`${SERVER_URL}/profile?android_offline=1`});
    checkConnection();
  </script>
</body>
</html>
