<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Tribu sin conexión</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:#fff3e0;color:#242424;font-family:system-ui,sans-serif}.card{width:min(100%,32rem);padding:2rem;text-align:center;background:#fff;border-radius:1.5rem;box-shadow:0 1rem 3rem #0002}img{width:8rem;height:8rem;border-radius:50%;object-fit:cover}button{padding:.85rem 1.25rem;border:0;border-radius:2rem;background:#ff8c00;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img src="iconoLogo.png" alt="La Tribu">
    <h1>Sin conexión</h1>
    <p>No existe una copia local completa de la página inicial. Conectate a Internet, ingresá como superusuario y ejecutá <strong>Cargar toda la información offline</strong>.</p>
    <button type="button" onclick="location.reload()">Volver a intentar</button>
  </main>
</body>
</html>
